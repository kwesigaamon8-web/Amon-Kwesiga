name: System-Wide AI Introductions
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/system-introductions.yml'
      - 'crypto-agents/system_introductions.py'
permissions:
  contents: read
  issues: write
concurrency:
  group: owner-ai-team-system-introductions
  cancel-in-progress: false
jobs:
  sampled-actual-introductions:
    name: Run 80 independently sampled model introductions and public payment-route briefing
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install small independent AI model
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet 'transformers>=4.44,<5'
      - name: Ask each sampled role to introduce itself using a real AI-model response
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DOWNLOAD_TIMEOUT: '60'
          OMP_NUM_THREADS: '2'
        run: python crypto-agents/system_introductions.py
      - name: Publish genuine responses summary
        if: always()
        run: |
          if [ -f system-introductions/SUMMARY.md ]; then
            cat system-introductions/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Archive each individual actual agent response and summary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: system-introductions-individual-model-responses
          path: system-introductions/
          retention-days: 14
          if-no-files-found: warn
