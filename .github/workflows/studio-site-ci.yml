name: B1 B2 Digital Work Studio — Site QA
on:
  push:
    paths:
      - 'docs/**'
      - '.github/workflows/studio-site-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-site:
    name: Run original browser data-workbench tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source files exist
        run: |
          test -f docs/index.html
          test -s docs/software.html
          test -s docs/join.html
          test -s docs/payment.html
          test -s docs/ai.html
          test -f docs/assets/engine.js
          test -f docs/assets/app.js
          test -f docs/assets/reconcile.js
          test -f docs/assets/reconcile-ui.js
          test -f docs/assets/styles.css
      - name: Run zero-dependency browser data engine tests
        run: node --test docs/tests/*.test.js
      - name: Check links to local assets
        run: |
          grep -q 'software.html' docs/index.html
          grep -q 'join.html' docs/index.html
          grep -q 'payment.html' docs/index.html
          grep -q 'ai.html' docs/index.html
          grep -q 'paid-work-request.yml' docs/ai.html
          grep -q 'payment.html' docs/ai.html
          grep -q 'payment.html' docs/software.html
          grep -q 'bc1qvprle87txnk7dgcgsau0nauxvvkwuyp0w9zc0z' docs/payment.html
          grep -q 'bc1qtaunz7mx7k588p8v544tq7x7ezxxcfky0h2vn9' docs/payment.html
          grep -q 'Bitcoin mainnet' docs/payment.html
          grep -q 'collaborator-join.yml' docs/join.html
          grep -q 'Bitcoin Merchant Watch Wallet' docs/software.html
          grep -q 'crypto-ledger/index.html' docs/software.html
          grep -q 'Bitcoin mining' docs/software.html
          grep -q 'assets/engine.js' docs/index.html
          grep -q 'assets/app.js' docs/index.html
          grep -q 'assets/reconcile.js' docs/index.html
          grep -q 'assets/reconcile-ui.js' docs/index.html
          grep -q 'assets/styles.css' docs/index.html
