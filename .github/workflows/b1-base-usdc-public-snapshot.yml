name: B1 Base Native USDC Public Read-Only Snapshot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/b1-base-usdc-public-snapshot.yml'
      - 'crypto-agents/paid-work/read-only-base-usdc.mjs'

permissions:
  contents: read

jobs:
  public-balance:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and exact-unit fixture tests
        run: |
          node --check crypto-agents/paid-work/read-only-base-usdc.mjs
          node crypto-agents/paid-work/read-only-base-usdc.mjs --self-test
      - name: Check public Base mainnet RPCs read-only
        run: node crypto-agents/paid-work/read-only-base-usdc.mjs
      - name: Preserve public Base USDC snapshot
        uses: actions/upload-artifact@v4
        with:
          name: b1-native-base-usdc-snapshot
          path: base-usdc-b1-public-snapshot.json
          retention-days: 7
          if-no-files-found: error
