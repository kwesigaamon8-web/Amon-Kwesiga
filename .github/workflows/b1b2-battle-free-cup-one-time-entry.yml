name: B1 B2 Free USDC November Cup One-time Entry
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/b1b2-battle-free-cup-one-time-entry.yml'
permissions:
  contents: write
concurrency:
  group: b1b2-battle-one-account-registration
  cancel-in-progress: false
jobs:
  one-free-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public-key encryption dependency; no wallet or fee
        run: python -m pip install --quiet 'cryptography>=42,<47'
      - name: ONE account, native Base USDC payout address, original controller, cup enrolment
        run: python crypto-agents/commercial-work/battle-hill-harvester/enter_cup.py
      - name: Commit ONLY encrypted account record and public entry proof
        if: always()
        run: |
          git config user.name 'b1b2-free-entry[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crypto-agents/commercial-work/battle-hill-harvester/entry-status.json || true
          git add crypto-agents/commercial-work/battle-hill-harvester/account-encrypted.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Record no-cost cup enrolment evidence and RSA-encrypted private claim credential"
            git push
          fi
