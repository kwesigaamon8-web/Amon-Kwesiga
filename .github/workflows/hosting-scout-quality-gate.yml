name: B1 B2 Hosting Discovery — Code Safety Tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'crypto-agents/hosting_scout.py'
      - 'crypto-agents/ability_based_dispatch.py'
      - 'crypto-agents/superworker_protocol.py'
      - 'crypto-agents/test_superworker_protocol.py'
      - 'crypto-agents/test_ability_based_dispatch.py'
      - 'crypto-agents/test_hosting_scout.py'
      - 'crypto-agents/ai_process_worker.py'
      - 'crypto-agents/HOSTING_RESEARCH_FOR_ALL_WORKERS.md'
      - 'crypto-agents/CHIEF_D_SHARED_OPERATIONAL_INTELLIGENCE.md'
      - '.github/workflows/hosting-scout-quality-gate.yml'
permissions:
  contents: read
jobs:
  verify-host-assignment:
    name: Validate official-host assignment without paid compute or internet
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check syntax and run deterministic offline tests
        run: |
          python -m py_compile crypto-agents/hosting_scout.py crypto-agents/ai_process_worker.py
          python crypto-agents/hosting_scout.py --self-test
          python crypto-agents/test_hosting_scout.py
          python -m py_compile crypto-agents/ability_based_dispatch.py
          python crypto-agents/ability_based_dispatch.py --self-test
          python crypto-agents/test_ability_based_dispatch.py
          python -m py_compile crypto-agents/superworker_protocol.py
          python crypto-agents/test_superworker_protocol.py
      - name: Show one ACTUAL assignment, NOT live hosting
        run: |
          python crypto-agents/hosting_scout.py --fleet transferexperiment --worker-id D01-M01-W01
          python crypto-agents/hosting_scout.py --fleet BountyScoutAI --worker-id D05-M05-W05
