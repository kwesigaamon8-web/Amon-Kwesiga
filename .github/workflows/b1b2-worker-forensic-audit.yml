name: B1 B2 Independent Forensic Worker-by-Worker Audit
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "B1 B2 1000 Worker Fleet - 900 Additional Executing Roles"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'crypto-agents/forensic_worker_audit.py'
      - '.github/workflows/b1b2-worker-forensic-audit.yml'
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: b1b2-finite-worker-forensic-audit
  cancel-in-progress: false
jobs:
  forensic-audit-900:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate forensic script and 900-synthetic-record negative-claim test
        run: |
          python -m py_compile crypto-agents/forensic_worker_audit.py
          python crypto-agents/forensic_worker_audit.py --self-test
      - name: Select actual latest successful 900-worker run (not a queued or failed run)
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          url=f"https://api.github.com/repos/{repo}/actions/workflows/thousand-worker-fleet.yml/runs?status=success&per_page=15"
          headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+os.environ["GH_TOKEN"],"User-Agent":"B1B2-Forensic-Audit"}
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as resp:
              data=json.load(resp)
          for run in data.get("workflow_runs",[]):
              if run.get("conclusion")=="success" and run.get("status")=="completed":
                  chosen=run
                  break
          else:
              raise SystemExit("No completed successful 900-worker run to audit")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"run_id={chosen['id']}\n")
          print("FORENSIC_SOURCE_RUN",chosen["id"],chosen["html_url"],chosen["head_sha"])
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          pattern: hundred-scout-shard-*
          path: thousand-fleet-evidence
          merge-multiple: true
      - name: Inspect every individual worker report and verify inherited order against source run
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path("thousand-fleet-evidence/B1-S01/snapshot.json")
          if not path.is_file():
              raise SystemExit("No B1-S01 source evidence found, cannot audit")
          order=json.loads(path.read_text())["owner_order_id"]
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write("AUDITED_OWNER_ORDER="+order+"\n")
          print("SOURCE_RUN_OWNER_ORDER",order)
          PY
      - name: Produce 900 per-worker evidence rows, source and buyer status
        run: |
          python crypto-agents/forensic_worker_audit.py --root thousand-fleet-evidence --order "$AUDITED_OWNER_ORDER" --out forensic-audit-evidence
          cat forensic-audit-evidence/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve all 900 forensic worker rows and report for owner
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1b2-forensic-worker-audit-900
          path: forensic-audit-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Post evidence-only summary to Chief D; never contact external buyers
        if: success() && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads(Path("forensic-audit-evidence/worker-forensic-audit.json").read_text())
          x=j["summary"]
          report=(
              "## Independent B1/B2 forensic audit — real subprocess evidence\n\n"
              f"Source GitHub run: https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['SOURCE_RUN_ID']}\n"
              f"Order received by source batch: {x['target_order']}\n"
              f"Workers with process evidence: {x['workers_with_process_evidence']}/900\n"
              f"Workers with matching order ID: {x['workers_with_matching_order']}/900\n"
              f"Workers actually triaging a source record: {x['workers_with_source_triage']}/900\n"
              f"Blocked without a source: {x['workers_blocked_without_source']}/900\n"
              f"Worker record integrity anomalies: {x['workers_with_any_error']}\n"
              "Independently verified customers 0, authorized proposals 0, accepted work 0, payments 0.\n"
              "Full per-worker CSV and JSON are saved as a workflow artifact. This does NOT prove 900 separate AI agents, authenticated buyer outreach or any of the virtual trillion roles running.\n"
              "Source unavailable and unqualified candidates must not be reported as completed customer acquisition."
          )
          Path("/tmp/forensic-chief-d-report.md").write_text(report)
          PY
          gh issue comment 9 --repo "${{ github.repository }}" --body-file /tmp/forensic-chief-d-report.md
