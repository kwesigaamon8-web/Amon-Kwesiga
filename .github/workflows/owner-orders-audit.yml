name: Owner Orders - Audit and Safe Execution
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/owner-orders-audit.yml'
      - 'crypto-agents/owner_orders.json'
      - 'crypto-agents/owner_order_audit.py'
      - 'crypto-agents/owner_command_chain.json'
      - 'crypto-agents/shared_understanding.json'
  schedule:
    - cron: '13 */3 * * *'
permissions:
  contents: read
  issues: read
concurrency:
  group: owner-order-audit
  cancel-in-progress: false
jobs:
  audit-commands:
    name: Audit orders, execute checks and route director actions
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Perform configuration audit and safe owner-order intake
        run: python crypto-agents/owner_order_audit.py --output owner-order-audit
      - name: Publish auditor's evidence and blocker list
        if: always()
        run: |
          if [ -f owner-order-audit/AUDIT.md ]; then
            cat owner-order-audit/AUDIT.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save full owner order audit and ten director queues
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-order-audit-and-director-queues
          path: owner-order-audit/
          if-no-files-found: warn
          retention-days: 14
