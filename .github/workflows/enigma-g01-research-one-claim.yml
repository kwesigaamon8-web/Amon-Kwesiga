name: Enigma G01 Research — One-Time Moltbook Human Claim
on:
  push:
    branches: [main]
    paths:
      - 'crypto-agents/register_enigma_g01_research_one_time.py'
      - '.github/workflows/enigma-g01-research-one-claim.yml'
permissions:
  contents: read
concurrency:
  group: enigma-g01-research-registration-once
  cancel-in-progress: false
jobs:
  register-one-agent-once:
    if: github.event.head_commit.message == 'Register EnigmaG01Research Moltbook first claim' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install cryptographic envelope before contacting Moltbook
        run: python -m pip install --quiet 'cryptography>=42,<47'
      - name: Validate encrypted credentials cannot appear in plaintext
        run: python crypto-agents/register_enigma_g01_research_one_time.py --self-test
      - name: Register exactly one agent and encrypt owner claim link and secret
        run: python crypto-agents/register_enigma_g01_research_one_time.py --register
      - name: Preserve encrypted registration result only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: enigma-g01-research-encrypted-owner-claim
          path: enigma-g01-registration-owner-encrypted.json
          if-no-files-found: error
          retention-days: 7
