name: B1 B2 Battle Cup No-cost Entry API Research
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/b1b2-battle-cup-api-research.yml'
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Collect official public API details without registering or spending
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error,pathlib,time
          urls=[
            "https://api.battle.training/llms.txt",
            "https://api.battle.training/openapi.json",
            "https://api.battle.training/api/openapi.json",
            "https://api.battle.training/api/cups",
            "https://api.battle.training/api/ladders",
            "https://battle.training/llms.txt"
          ]
          result={"at_utc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()),"pages":{}}
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={"Accept":"text/plain, application/json","User-Agent":"B1B2-Cash-Research/1"})
              with urllib.request.urlopen(req,timeout=12) as f:
                body=f.read(120000).decode("utf-8","replace")
                if "llms.txt" in url:
                  lines=body.splitlines()
                  picks=[(n+1,l[:450]) for n,l in enumerate(lines) if any(w in l.lower() for w in ("create_account","create_bot","upload_version","set_payout_wallet","get_started","controller","ladders","cup","enrol","api/","auth","register","agent","model","starter","rules","league","token","account","battle"))]
                  result["pages"][url]={"status":f.status,"length":len(body),"lines":len(lines),"selected_lines":picks[:190]}
                else:
                  try:
                    obj=json.loads(body)
                    if isinstance(obj,dict) and "paths" in obj:
                      result["pages"][url]={"status":f.status,"info":obj.get("info"),"paths":{k:{method:{"summary":d.get("summary"),"operationId":d.get("operationId"),"security":d.get("security"),"requestBody":d.get("requestBody"),"parameters":d.get("parameters")}for method,d in val.items() if isinstance(d,dict)}for k,val in obj["paths"].items() if any(w in k for w in ("account","bot","ladder","cup","version","payout","match","start"))}}
                    else:result["pages"][url]={"status":f.status,"json":obj}
                  except Exception:result["pages"][url]={"status":f.status,"first_500":body[:500]}
            except Exception as e:result["pages"][url]={"error":str(e)[:250]}
          path=pathlib.Path("crypto-agents/paid-opportunity-reports/battle-training-api-notes.json")
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(result,indent=2,ensure_ascii=False)+"\n")
          print("BATTLE_API_RESEARCH",json.dumps({k:{"status":v.get("status"),"error":v.get("error"),"paths":len(v.get("paths",{})),"lines":v.get("lines")}for k,v in result["pages"].items()}))
          PY
      - name: Save evidence only
        run: |
          git config user.name 'b1b2-cash-scout[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crypto-agents/paid-opportunity-reports/battle-training-api-notes.json
          if ! git diff --cached --quiet; then
            git commit -m "Read-only official Base USDC cup participation API documentation"
            git push
          fi
