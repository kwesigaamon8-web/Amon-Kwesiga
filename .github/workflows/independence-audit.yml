name: AI Independence and Reporting Audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/independence-audit.yml'
      - 'crypto-agents/audit_independence.py'
      - 'crypto-agents/agent_registry.csv'
      - 'crypto-agents/company_hierarchy.json'
      - 'crypto-agents/microcompany_structure.json'
      - 'crypto-agents/microcompany_factory.py'
      - 'crypto-agents/microcompany_audit.py'
      - 'crypto-agents/mega_branch_666.json'
      - 'crypto-agents/mega_branch_factory.py'
      - 'crypto-agents/mega_branch_audit.py'
  schedule:
    - cron: '7 3 * * *'
permissions:
  contents: read
jobs:
  check-independence:
    name: Verify hierarchy plus 562.5m nested-role ID formula
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check every reporting line and distinct identity
        run: python crypto-agents/audit_independence.py --output independence-audit
      - name: Verify unique nested microcompany identity formula
        run: python crypto-agents/microcompany_factory.py
      - name: Audit 1.125m nested companies without materializing all roles
        run: python crypto-agents/microcompany_audit.py --output microcompany-audit
      - name: Prove 666 children per G parent without allocating 374.625bn rows
        run: python crypto-agents/mega_branch_factory.py
      - name: Audit 374.625bn deterministic worker IDs and one-parent flow
        run: python crypto-agents/mega_branch_audit.py --output mega-branch-audit
      - name: Publish audit to GitHub workflow summary
        if: always()
        run: |
          if [ -f independence-audit/audit.md ]; then
            cat independence-audit/audit.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f microcompany-audit/AUDIT.md ]; then
            cat microcompany-audit/AUDIT.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f mega-branch-audit/AUDIT.md ]; then
            cat mega-branch-audit/AUDIT.md >> "$GITHUB_STEP_SUMMARY"
          fi
          fi
          fi
      - name: Archive evidence
        id: first-archive
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ai-independence-integrity-audit
          path: |
            independence-audit/
            microcompany-audit/
            mega-branch-audit/
          retention-days: 14
          if-no-files-found: warn
      - name: Retry evidence upload if the first connection failed
        if: ${{ always() && steps.first-archive.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ai-independence-integrity-audit-retry
          path: |
            independence-audit/
            microcompany-audit/
            mega-branch-audit/
          retention-days: 14
          if-no-files-found: warn
