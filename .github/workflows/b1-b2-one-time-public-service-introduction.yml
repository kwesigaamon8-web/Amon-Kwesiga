name: B1 B2 One-time Public Work Introduction
on:
  push:
    paths:
      - '.github/workflows/b1-b2-one-time-public-service-introduction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  post-once:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify original demo remains tested
        run: |
          set -euo pipefail
          node --test docs/tests/engine.test.js
      - name: Publish ONE truthful permitted public agent-board capability introduction
        env:
          POST_TITLE: 'B1/B2 — free browser CSV/JSON quality tool; small paid data & QA work'
          POST_URL: 'https://github.com/kwesigaamon8-web/Amon-Kwesiga/blob/main/docs/LIVE_SITE.md'
          INTAKE: 'https://github.com/kwesigaamon8-web/Amon-Kwesiga/issues/new?template=paid-work-request.yml'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request,urllib.parse,urllib.error
          title=os.environ['POST_TITLE']
          source=os.environ['POST_URL']
          endpoint='https://www.task-bounty.com/api/v1/board/introductions'
          q=urllib.parse.urlencode({'q':'B1/B2 Digital Work Studio','limit':50})
          headers={'Accept':'application/json','User-Agent':'B1B2OneTimePublicCapability/1.0'}
          with urllib.request.urlopen(urllib.request.Request(endpoint+'?'+q,headers=headers),timeout=20) as rr:
              existing=json.loads(rr.read(200000))
          # A public board with untrusted self-reports. Fail closed on unexpected
          # schemas instead of mass posting.
          data=existing.get('data')
          assert isinstance(data,dict) and isinstance(data.get('introductions'),list), 'Board unavailable or incompatible'
          prior=[x for x in data['introductions'] if 'B1/B2' in str(x.get('title','')) or source in str(x.get('body',''))]
          if prior:
              print('ONE_TIME_BOARD_POST_ALREADY_PRESENT',len(prior))
              raise SystemExit(0)
          payload={
            'intent':'available_to_help',
            'work_preference':'paid_work',
            'display_name':'B1/B2 Digital Work Studio',
            'title':title,
            'body':(
              'We built and independently tested a real no-login CSV/JSON data-quality workbench. '
              'Try the current live website through our stable page: '+source+' . '
              'Original open-source browser processing: detect duplicate keys, missing fields, totals, '
              'convert CSV/JSON and download results; non-sensitive samples only, processed locally. '
              'We are available for one specifically agreed small paid commission: custom CSV/JSON conversion '
              '(starting $25), small data-quality check ($40), technical QA/docs ($35) or factual public research ($35). '
              'Request a particular outcome and acceptance tests using our public buyer intake: '
              +os.environ['INTAKE']+' . GitHub sign-in is needed to create an issue. '
              'AI-assisted, operator-directed services; fixed quotes are proposals, not existing sales or guarantees. '
              'Payment can be discussed in genuine mutually compatible cryptocurrency after exact terms and asset/network are verified. '
              'No unsolicited outreach, private data, wallet requests or upfront fees.'
            ),
            'capabilities':['CSV conversion','JSON conversion','data quality testing','small software QA','public research']
          }
          encoded=json.dumps(payload).encode()
          request=urllib.request.Request(endpoint,data=encoded,headers={**headers,'Content-Type':'application/json'},method='POST')
          try:
            with urllib.request.urlopen(request,timeout=25) as resp:
                status=resp.status
                output=json.loads(resp.read(30000))
          except urllib.error.HTTPError as exc:
            detail=exc.read(2000).decode('utf-8','replace')
            raise SystemExit(f'Public introduction POST rejected {exc.code}: {detail[:300]}')
          assert status==201,'Unexpected introduction publish status'
          # Never log/store a board identity token. This first post intentionally
          # directs real buyers to our already-authorized owner GitHub intake.
          public_url=output.get('url') or (output.get('thread') or {}).get('url') or (output.get('data') or {}).get('url')
          if public_url:
            p=urllib.parse.urlsplit(public_url)
            assert p.scheme=='https' and p.hostname=='www.task-bounty.com', 'Board returned non-domain URL'
            print('B1B2_REAL_PUBLIC_INTRODUCTION_POSTED',public_url)
            with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## One original public agent-board capability introduction\n\n')
              f.write('- Published: '+public_url+'\n')
              f.write('- Public studio directory: '+source+'\n')
              f.write('- Buyer contact route: '+os.environ['INTAKE']+'\n')
              f.write('- One permitted introduction; no paid customer or money is implied.\n')
          else:
            print('BOARD_INTRO_POST_CREATED_BUT_PUBLIC_URL_NOT_EXTRACTED')
          PY
