name: B1 B2 Real USDC Cup Qualification and $15 Payout Gate
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/b1b2-battle-usdc-qualifier-watch.yml'
      - 'crypto-agents/earning_loop_state_gate.py'
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify real public ranked sets and sponsored cup eligibility
        run: |
          python - <<'PY'
          import urllib.request,json,time,pathlib
          B="b1b2-hill-harvester"
          root="https://api.battle.training"
          urls={"bot":"/api/bots/"+B,"house_starter":"/api/bots/house-starter","cup":"/api/ladders/promotedby-cup-nov-2026","ladder":"/api/ladder"}
          result={"checked_at_utc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()),"bot":B,"evidence":{},"cup_qualified":False,"public_rating_above_starter":None,"sponsor_bounty_ready_for_review":False,"actual_usdc_received":False}
          for name,path in urls.items():
            try:
              q=urllib.request.Request(root+path,headers={"User-Agent":"B1B2-Original-Bot-RealMoneyGate/1","Accept":"application/json"})
              with urllib.request.urlopen(q,timeout=15) as f:
                data=json.loads(f.read(220000))
              if name in ("bot","house_starter"):
                result["evidence"][name]={"http":200,"public_url":"https://battle.training/bots/"+(B if name=="bot" else "house-starter"),"data":data}
              elif name=="cup":
                entry=next((v for v in data.get("standings",[])if v.get("bot")==B),None)
                result["evidence"][name]={"http":200,"prize_usd":data.get("prize"),"entry":entry,"enrolled":data.get("enrolled")}
                result["cup_qualified"]=bool(entry and entry.get("qualified"))
              else:
                scores=data.get("standings",data.get("bots",data.get("ladder",[]))) if isinstance(data,dict) else data
                if isinstance(scores,dict):scores=scores.get("bots",scores.get("standings",[]))
                rows=scores if isinstance(scores,list) else []
                ours=next((r for r in rows if isinstance(r,dict)and (r.get("bot")==B or r.get("name")==B)),None)
                starter=next((r for r in rows if isinstance(r,dict)and (r.get("bot")=="house-starter" or r.get("name")=="house-starter")),None)
                result["evidence"][name]={"http":200,"ours":ours,"house_starter":starter}
                if ours and starter:
                  our_rate=ours.get("rating")
                  house_rate=starter.get("rating")
                  if isinstance(our_rate,(float,int))and isinstance(house_rate,(float,int)):
                    result["public_rating_above_starter"]=our_rate>house_rate
            except Exception as e:result["evidence"][name]={"error":str(e)[:180]}
          own=result["evidence"].get("bot",{}).get("data") or {}
          house=result["evidence"].get("house_starter",{}).get("data") or {}
          own_armor=(own.get("theaters") or {}).get("armor") or {}
          house_armor=(house.get("theaters") or {}).get("armor") or {}
          result["public_ranked_sets"]=int(own_armor.get("sets") or 0)
          result["house_public_ranked_sets"]=int(house_armor.get("sets") or 0)
          result["cup_ranked_sets"]=int((result["evidence"].get("cup",{}).get("entry") or {}).get("games") or 0)
          result["cup_sets_left"]=max(0,100-result["cup_ranked_sets"])
          result["public_sets_left_for_promo"]=max(0,100-result["public_ranked_sets"])
          if isinstance(own_armor.get("rating"),(int,float)) and isinstance(house_armor.get("rating"),(int,float)):
            result["public_rating_above_starter"]=own_armor["rating"]>house_armor["rating"]
          result["sponsor_bounty_ready_for_review"]=result["public_ranked_sets"]>=100 and result["public_rating_above_starter"] is True
          result["proven_new_income"]=False
          result["credential_recoverable"]=False
          result["credential_note"]="The account public key-encrypted record exists; corresponding private decryption key not verified. Never expose credentials in logs or create a duplicate account."
          path=pathlib.Path("crypto-agents/commercial-work/battle-hill-harvester/live-qualifier-status.json")
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(result,indent=2,ensure_ascii=False)+"\n")
          print("REAL_CUP_MONEY_GATE",json.dumps({"checked":result["checked_at_utc"],"public_sets":result.get("public_ranked_sets"),"cup_sets":result.get("cup_ranked_sets"),"cup_qualified":result["cup_qualified"],"public_rating_above_starter":result["public_rating_above_starter"],"ready_for_sponsor":result["sponsor_bounty_ready_for_review"],"received":False}))
          PY
      - name: Check genuine progress gate regression tests
        run: python crypto-agents/earning_loop_state_gate.py --self-test
      - name: Archive latest factual cup observation without rewriting repository
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1b2-cup-observation
          path: crypto-agents/commercial-work/battle-hill-harvester/live-qualifier-status.json
          retention-days: 4
          if-no-files-found: warn
      - name: Persist only actual cup milestones, not repeated timestamp commits
        if: success()
        run: |
          set -euo pipefail
          report="crypto-agents/commercial-work/battle-hill-harvester/live-qualifier-status.json"
          cp "$report" "$RUNNER_TEMP/b1b2-current.json"
          git config user.name "b1b2-evidence-milestone[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            set +e
            python crypto-agents/earning_loop_state_gate.py --kind cup --old "$report" --new "$RUNNER_TEMP/b1b2-current.json"
            code=$?
            set -e
            if [ "$code" -eq 3 ]; then
              echo "NO_NEW_MATERIAL_CUP_MILESTONE"
              exit 0
            fi
            if [ "$code" -ne 0 ]; then
              echo "UNEXPECTED_MILESTONE_GATE_ERROR $code" >&2
              exit "$code"
            fi
            cp "$RUNNER_TEMP/b1b2-current.json" "$report"
            git add "$report"
            git commit -m "Persist 25-set progress or actual cup/sponsor qualification milestone"
            if git push origin HEAD:main; then
              echo "PERSISTED_MATERIAL_CUP_MILESTONE"
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "MILESTONE_PERSIST_FAILED_AFTER_CONCURRENT_UPDATES" >&2
          exit 1
