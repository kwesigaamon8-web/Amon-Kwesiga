name: B1 B2 Recurring Real AI Worker Shifts
on:
  push:
    paths:
      - '.github/workflows/b-learning-live-pilot.yml'
      - 'crypto-agents/b_paid_feed_fallback.py'
      - 'crypto-agents/bounty_eligibility_audit.py'
      - 'crypto-agents/b_worker_buyer_source.py'
      - 'crypto-agents/b_learning_by_doing.py'
      - 'crypto-agents/new_earning_lanes.py'
      - 'crypto-agents/ai_process_worker.py'
      - 'crypto-agents/b_registered_account_worker_map.py'
      - 'crypto-agents/b_delegated_prospect_batch.py'
      - 'crypto-agents/b_shift_accountability.py'
      - 'crypto-agents/b_shift_worker_rotation.py'
      - 'crypto-agents/b_live_peer_teaching.py'
  workflow_dispatch:
  schedule:
    # B1/B2 each launch FIVE rotated REAL worker models per 15-minute shift, all days.
    # Schedule is best-effort and may be delayed/skipped by GitHub.
    - cron: '2,17,32,47 * * * *'
concurrency:
  group: b1-b2-recurring-real-worker-shifts
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  current-original-sources:
    name: Fetch one shared real-world task feed for both companies
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check currently open GitHub task candidates once per shift
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python crypto-agents/new_earning_lanes.py
      - name: Execute bounded original-role checks on actual public job candidate metadata
        if: always()
        run: |
          python crypto-agents/b_delegated_prospect_batch.py --self-test
          python crypto-agents/b_delegated_prospect_batch.py --feed paid-opportunity-reports/new-earning-lanes.json --out paid-opportunity-reports/delegated-account-work
          cat paid-opportunity-reports/delegated-account-work/delegated-agent-work.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save original source candidate evidence (not funding proof)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-original-issue-feed
          path: paid-opportunity-reports/new-earning-lanes.json
          if-no-files-found: warn
          retention-days: 2
  active-learning-worker:
    needs: current-original-sources
    name: ${{ matrix.fleet }} / slot ${{ matrix.slot }} — actual B model + applied work
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - fleet: transferexperiment
            slot: 0
          - fleet: transferexperiment
            slot: 1
          - fleet: transferexperiment
            slot: 2
          - fleet: transferexperiment
            slot: 3
          - fleet: transferexperiment
            slot: 4
          - fleet: BountyScoutAI
            slot: 0
          - fleet: BountyScoutAI
            slot: 1
          - fleet: BountyScoutAI
            slot: 2
          - fleet: BountyScoutAI
            slot: 3
          - fleet: BountyScoutAI
            slot: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Choose a genuinely rotating assigned B worker
        id: role
        env:
          B_FLEET: ${{ matrix.fleet }}
          B_CYCLE: ${{ github.run_number }}
          B_SLOT: ${{ matrix.slot }}
        run: |
          python crypto-agents/b_shift_worker_rotation.py --self-test
          python - <<'PY'
          import json,os
          from pathlib import Path
          import sys
          sys.path.insert(0, "crypto-agents")
          from b_shift_worker_rotation import select
          item=select(os.environ["B_FLEET"],int(os.environ["B_CYCLE"]),int(os.environ["B_SLOT"]))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write("worker="+item["worker_id"]+"\n")
          print("ACTUAL_B_SHIFT_ASSIGNED",json.dumps(item))
          PY
      - name: Verify the real-work training evaluator
        run: |
          python -m py_compile crypto-agents/ai_process_worker.py crypto-agents/b_learning_by_doing.py crypto-agents/b_worker_buyer_source.py crypto-agents/b_shift_worker_rotation.py crypto-agents/owner_first_oath.py crypto-agents/b_paid_feed_fallback.py crypto-agents/bounty_eligibility_audit.py
          python crypto-agents/b_learning_by_doing.py
          python crypto-agents/bounty_eligibility_audit.py --self-test
          python crypto-agents/b_worker_buyer_source.py
          python crypto-agents/b_paid_feed_fallback.py
          python crypto-agents/owner_first_oath.py
          python crypto-agents/b_universal_work_protocol.py --self-test
      - name: Install open-source CPU inference runtime
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet 'transformers>=4.44,<5'
      - name: Retrieve common original issue feed (no duplicate searches)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: shared-original-issue-feed
          path: paid-opportunity-reports
      - name: Actually run one B worker and teach while it performs source research
        env:
          WORKFORCE_ID: ${{ matrix.fleet }}
          GH_TOKEN: ${{ github.token }}
          WORKER_MODEL_ID: Qwen/Qwen2.5-0.5B-Instruct
          HF_HUB_DISABLE_TELEMETRY: '1'
          OMP_NUM_THREADS: '2'
        run: python crypto-agents/ai_process_worker.py "${{ steps.role.outputs.worker }}"
      - name: Audit real practical response and work sample file
        env:
          WORKFORCE_ID: ${{ matrix.fleet }}
          WORKER_ID: ${{ steps.role.outputs.worker }}
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          worker=os.environ["WORKER_ID"]
          file=Path("ai-process-reports")/(worker+".json")
          assert file.exists(),"Worker did not create a real report"
          r=json.loads(file.read_text())
          assert r["workforce_namespace"]==os.environ["WORKFORCE_ID"],"Wrong B company"
          universal=r.get("universal_task_message") or {}
          assigned=universal.get("assignment") or {}
          assert assigned.get("worker_id")==r["workforce_namespace"]+"/"+worker,"Wrong universal worker identity"
          assert assigned.get("report_to")==r["workforce_namespace"]+"/"+r["parent_id"],"Wrong direct reporting parent"
          assert (universal.get("owner_origin") or {}).get("owner_only_top_level") is True,"Owner-first oath not preserved"
          assert assigned.get("task_id") and assigned.get("unique_scope_id"),"No individually unique worldwide task"
          pay=universal.get("payment") or {}
          assert pay.get("per_worker_owner_appreciation_earning_target_usd")=="0.01","Missing owner one-cent worker milestone"
          assert pay.get("buyer_accepted_work") is False and pay.get("real_coin_payment_verified") is False,"Cannot pretend a penny has been paid"
          assert pay.get("no_transfers_without_actual_spend_authorization") is True,"No spending authorization guard"
          assert r.get("universal_task_status")=="ASSIGNED_NOT_YET_PERFORMED","Task allocation is not proof of doing"
          print("UNIVERSAL_INDIVIDUAL_TASK",json.dumps({
            "company":r["workforce_namespace"],"worker":worker,
            "task_id":assigned["task_id"],"market":assigned["city_focus"],
            "country":assigned["country_iso_3166_alpha2"],
            "language":(universal.get("localization") or {}).get("content_language"),
            "actual_execution_required":True}))
          assert r["inference_status"]=="model_completed", "No real worker model inference"
          assert r["strict_owner_order_id"]==(r.get("owner_activation_order_coverage_proof") or {}).get("canonical_order_id"), "Not the latest owner command at activation"
          expected_order=json.loads(Path("crypto-agents/chief_D_owner_orders.json").read_text())["current_owner_order_id"]
          assert r["strict_owner_order_id"]==expected_order, "Stale owner order in this shift"
          account=r.get("registered_agent_account_delegation") or {}
          assert account.get("registered_agent_handle")==r["workforce_namespace"], "Wrong company account in real AI job"
          assert account.get("original_role_id")==r["workforce_namespace"]+"/"+worker, "Wrong worker association"
          assert account.get("company_original_role_capacity")==375188632680, "Incorrect account role capacity"
          assert account.get("owner_receiving_BTC_mainnet")==pay.get("owner_mainnet_address"), "Wrong company payment destination"
          print("REGISTERED_AGENT_ACCOUNT_REAL_WORKER_GATE",json.dumps({"account":account.get("registered_agent_handle"),"worker":worker,"model_status":r.get("inference_status")}))
          assert (r.get("entrepreneurial_autonomy") or {}).get("payment_receiver")==pay.get("owner_mainnet_address"), "Wrong authorized settlement address"
          p=r.get("practical_training_while_working") or {}
          assert p.get("independent_model_call_status")=="MODEL_COMPLETED","No real practice inference"
          result=p["result"]
          assert result["real_model_call_completed"],"No actual training model reply"
          assert Path(p["actual_work_sample_file"]).is_file(),"Missing original sample"
          assert result["actual_payment_verified"] is False,"Cannot invent payments"
          status={
             "company":r["workforce_namespace"],"worker":worker,
             "real_pid":r["os_process_pid"],"lesson":p["assignment"]["focus"],
             "practical_status":result["status"],"source":p["assignment"]["real_original_research_url"],
             "payment_verified":False}
          print("ACTUAL_B_TRAINING_WHILE_WORKING",json.dumps(status))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
             out.write("### REAL B worker shift — "+status["company"]+"\n\n")
             out.write("- Actual worker: "+worker+"\n")
             out.write("- Worker OS PID: "+str(status["real_pid"])+"\n")
             out.write("- Training lesson: "+status["lesson"]+"\n")
             out.write("- Universal task ID: "+assigned["task_id"]+"\n")
             out.write("- Worker BTC appreciation micro-target: USD $0.01 equivalent (NOT a confirmed payment)\n")
             out.write("- Country/city research focus: "+assigned["country_iso_3166_alpha2"]+" / "+assigned["city_focus"]+"\n")
             out.write("- Localization tag (not proof of translation): "+universal["localization"]["content_language"]+"\n")
             out.write("- Practical grade: "+status["practical_status"]+"\n")
             out.write("- Actual issue/source: "+(status["source"] or "No original source confirmed")+"\n")
             out.write("- Verified crypto receipt: NOT ESTABLISHED by this worker run\n")
          PY
      - name: Archive executed worker model response and practical work product
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practical-work-${{ matrix.fleet }}-slot-${{ matrix.slot }}
          path: ai-process-reports/
          if-no-files-found: warn
          retention-days: 15
  peer-teach-and-do:
    name: ${{ matrix.fleet }} learns from OTHER actual B worker while testing deliverable
    if: ${{ always() && needs.active-learning-worker.result == 'success' }}
    needs: [active-learning-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        fleet: [transferexperiment, BountyScoutAI]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download BOTH companies' verified actual worker reports, not synthetic identities
        uses: actions/download-artifact@v4
        with:
          pattern: practical-work-*
          path: shift-evidence
          merge-multiple: false
      - name: Verify peer teaching selection cannot fabricate execution or payment
        run: python crypto-agents/b_live_peer_teaching.py --self-test
      - name: Install small CPU model to learn FROM the opposite real B worker
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet 'transformers>=4.44,<5' pytest
      - name: Conduct NEW peer AI model inference and run real work-product tests
        env:
          STUDENT_COMPANY: ${{ matrix.fleet }}
          HF_HUB_DISABLE_TELEMETRY: '1'
          OMP_NUM_THREADS: '2'
        run: |
          python crypto-agents/b_live_peer_teaching.py --fleet "$STUDENT_COMPANY" --inputs shift-evidence --output peer-learning
          cat "peer-learning/$STUDENT_COMPANY-peer-applied-learning.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve independently executed peer-learning model reply and commercial tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-peer-teaching-${{ matrix.fleet }}
          path: peer-learning/
          if-no-files-found: warn
          retention-days: 15
  chief-D-actual-shift:
    name: Chief D consolidates ACTUALLY completed model work for both companies
    if: always()
    needs: [current-original-sources, active-learning-worker, peer-teach-and-do]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect individual actual worker proofs, if any
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: practical-work-*
          path: shift-evidence/
          merge-multiple: false
      - name: Strictly count model proofs, practical lessons and incomplete workers
        env:
          B_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m py_compile crypto-agents/b_shift_accountability.py
          python crypto-agents/b_shift_accountability.py --self-test
          python crypto-agents/b_shift_accountability.py --inputs shift-evidence --output shift-chief-D --run-url "$B_RUN_URL"
          cat shift-chief-D/CHIEF_D_SHIFT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retrieve actual inter-company peer lesson evidence
        if: always()
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: real-peer-teaching-*
          path: peer-learning-actual
          merge-multiple: false
      - name: Report whether EACH B model really taught and learned from opposite fleet
        if: always()
        run: |
          python - <<'PY'
          import json,glob,os
          paths=glob.glob("peer-learning-actual/**/*.json",recursive=True)
          rows=[]
          for p in paths:
              try:
                  with open(p,encoding="utf-8") as f:x=json.load(f)
                  if x.get("schema")=="REAL_B_PEER_TEACH_AND_APPLY_V1":rows.append(x)
              except (OSError,ValueError):continue
          complete=sum(1 for x in rows if x.get("student_model_reply_completed") and x.get("peer_teaching_from_proven_model"))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("\n### REAL cross-company peer teaching, not synthetic AI replies\n")
              f.write("- Actual completed new peer-learning model calls: "+str(complete)+"/2\n")
              for x in rows:
                  peer=x.get("cross_company_peer") or {}
                  f.write("- "+x["company"]+" learned from executed "+str(peer.get("company","NONE"))+
                    "/"+str(peer.get("teacher_worker_id","NONE"))+
                    "; own model="+str(x.get("student_model_reply_completed"))+
                    "; grade="+str(x.get("lesson_grade"))+
                    "; code tests="+str((x.get("real_code_test") or {}).get("test_status"))+"\n")
              f.write("- Verified new paid contract or incoming cryptocurrency from these lessons: NOT ESTABLISHED\n")
          print("CHIEF_D_REAL_PEER_TEACHING",json.dumps({"completed_new_peer_model_calls":complete,"expected":2,"reported_files":len(rows),"verified_payments":0}))
          PY
      - name: Preserve one honest Chief D company and worker shift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chief-D-real-shift-aggregation
          path: shift-chief-D/
          if-no-files-found: warn
          retention-days: 15
