name: B1 B2 Recurring Real AI Worker Shifts
on:
  push:
    paths:
      - '.github/workflows/b-learning-live-pilot.yml'
  workflow_dispatch:
  schedule:
    # B1 and B2 each launch TWO rotated REAL models per 15-minute shift, all days.
    # Schedule is best-effort and may be delayed/skipped by GitHub.
    - cron: '2,17,32,47 * * * *'
concurrency:
  group: b1-b2-recurring-real-worker-shifts
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  current-original-sources:
    name: Fetch one shared real-world task feed for both companies
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check currently open GitHub task candidates once per shift
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python crypto-agents/new_earning_lanes.py
      - name: Save original source candidate evidence (not funding proof)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-original-issue-feed
          path: paid-opportunity-reports/new-earning-lanes.json
          if-no-files-found: warn
          retention-days: 2
  active-learning-worker:
    needs: current-original-sources
    name: ${{ matrix.fleet }} / slot ${{ matrix.slot }} — actual B model + applied work
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - fleet: transferexperiment
            slot: 0
          - fleet: transferexperiment
            slot: 1
          - fleet: BountyScoutAI
            slot: 0
          - fleet: BountyScoutAI
            slot: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Choose a genuinely rotating assigned B worker
        id: role
        env:
          B_FLEET: ${{ matrix.fleet }}
          B_CYCLE: ${{ github.run_number }}
          B_SLOT: ${{ matrix.slot }}
        run: |
          python crypto-agents/b_shift_worker_rotation.py --self-test
          python - <<'PY'
          import json,os
          from pathlib import Path
          import sys
          sys.path.insert(0, "crypto-agents")
          from b_shift_worker_rotation import select
          item=select(os.environ["B_FLEET"],int(os.environ["B_CYCLE"]),int(os.environ["B_SLOT"]))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write("worker="+item["worker_id"]+"\n")
          print("ACTUAL_B_SHIFT_ASSIGNED",json.dumps(item))
          PY
      - name: Verify the real-work training evaluator
        run: |
          python -m py_compile crypto-agents/ai_process_worker.py crypto-agents/b_learning_by_doing.py crypto-agents/b_worker_buyer_source.py crypto-agents/b_shift_worker_rotation.py crypto-agents/owner_first_oath.py
          python crypto-agents/b_learning_by_doing.py
          python crypto-agents/b_worker_buyer_source.py
          python crypto-agents/owner_first_oath.py
          python crypto-agents/b_universal_work_protocol.py --self-test
      - name: Install open-source CPU inference runtime
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet 'transformers>=4.44,<5'
      - name: Retrieve common original issue feed (no duplicate searches)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: shared-original-issue-feed
          path: paid-opportunity-reports
      - name: Actually run one B worker and teach while it performs source research
        env:
          WORKFORCE_ID: ${{ matrix.fleet }}
          GH_TOKEN: ${{ github.token }}
          WORKER_MODEL_ID: HuggingFaceTB/SmolLM2-360M-Instruct
          HF_HUB_DISABLE_TELEMETRY: '1'
          OMP_NUM_THREADS: '2'
        run: python crypto-agents/ai_process_worker.py "${{ steps.role.outputs.worker }}"
      - name: Audit real practical response and work sample file
        env:
          WORKFORCE_ID: ${{ matrix.fleet }}
          WORKER_ID: ${{ steps.role.outputs.worker }}
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          worker=os.environ["WORKER_ID"]
          file=Path("ai-process-reports")/(worker+".json")
          assert file.exists(),"Worker did not create a real report"
          r=json.loads(file.read_text())
          assert r["workforce_namespace"]==os.environ["WORKFORCE_ID"],"Wrong B company"
          universal=r.get("universal_task_message") or {}
          assigned=universal.get("assignment") or {}
          assert assigned.get("worker_id")==r["workforce_namespace"]+"/"+worker,"Wrong universal worker identity"
          assert assigned.get("report_to")==r["workforce_namespace"]+"/"+r["parent_id"],"Wrong direct reporting parent"
          assert (universal.get("owner_origin") or {}).get("owner_only_top_level") is True,"Owner-first oath not preserved"
          assert assigned.get("task_id") and assigned.get("unique_scope_id"),"No individually unique worldwide task"
          assert r.get("universal_task_status")=="ASSIGNED_NOT_YET_PERFORMED","Task allocation is not proof of doing"
          print("UNIVERSAL_INDIVIDUAL_TASK",json.dumps({
            "company":r["workforce_namespace"],"worker":worker,
            "task_id":assigned["task_id"],"market":assigned["city_focus"],
            "country":assigned["country_iso_3166_alpha2"],
            "language":(universal.get("localization") or {}).get("content_language"),
            "actual_execution_required":True}))
          assert r["inference_status"]=="model_completed", "No real worker model inference"
          p=r.get("practical_training_while_working") or {}
          assert p.get("independent_model_call_status")=="MODEL_COMPLETED","No real practice inference"
          result=p["result"]
          assert result["real_model_call_completed"],"No actual training model reply"
          assert Path(p["actual_work_sample_file"]).is_file(),"Missing original sample"
          assert result["actual_payment_verified"] is False,"Cannot invent payments"
          status={
             "company":r["workforce_namespace"],"worker":worker,
             "real_pid":r["os_process_pid"],"lesson":p["assignment"]["focus"],
             "practical_status":result["status"],"source":p["assignment"]["real_original_research_url"],
             "payment_verified":False}
          print("ACTUAL_B_TRAINING_WHILE_WORKING",json.dumps(status))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
             out.write("### REAL B worker shift — "+status["company"]+"\n\n")
             out.write("- Actual worker: "+worker+"\n")
             out.write("- Worker OS PID: "+str(status["real_pid"])+"\n")
             out.write("- Training lesson: "+status["lesson"]+"\n")
             out.write("- Universal task ID: "+assigned["task_id"]+"\n")
             out.write("- Country/city research focus: "+assigned["country_iso_3166_alpha2"]+" / "+assigned["city_focus"]+"\n")
             out.write("- Localization tag (not proof of translation): "+universal["localization"]["content_language"]+"\n")
             out.write("- Practical grade: "+status["practical_status"]+"\n")
             out.write("- Actual issue/source: "+(status["source"] or "No original source confirmed")+"\n")
             out.write("- Verified crypto receipt: NOT ESTABLISHED by this worker run\n")
          PY
      - name: Archive executed worker model response and practical work product
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practical-work-${{ matrix.fleet }}-slot-${{ matrix.slot }}
          path: ai-process-reports/
          if-no-files-found: warn
          retention-days: 15
  chief-D-actual-shift:
    name: Chief D consolidates ACTUALLY completed model work for both companies
    if: always()
    needs: [current-original-sources, active-learning-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect individual actual worker proofs, if any
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: practical-work-*
          path: shift-evidence/
          merge-multiple: false
      - name: Strictly count model proofs, practical lessons and incomplete workers
        env:
          B_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python -m py_compile crypto-agents/b_shift_accountability.py
          python crypto-agents/b_shift_accountability.py --self-test
          python crypto-agents/b_shift_accountability.py --inputs shift-evidence --output shift-chief-D --run-url "$B_RUN_URL"
          cat shift-chief-D/CHIEF_D_SHIFT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve one honest Chief D company and worker shift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chief-D-real-shift-aggregation
          path: shift-chief-D/
          if-no-files-found: warn
          retention-days: 15
