name: Validate B to Chief D Reporting
on:
  push:
    paths:
      - '.github/workflows/b-hierarchy-validation.yml'
      - 'crypto-agents/hierarchical_reporting.py'
      - 'crypto-agents/test_hierarchical_reporting.py'
      - 'crypto-agents/post_hierarchical_reports.py'
      - 'crypto-agents/chief_D_reporting.py'
      - 'crypto-agents/b_learning_by_doing.py'
      - 'crypto-agents/ai_process_worker.py'
      - 'crypto-agents/b_worker_buyer_source.py'
      - 'crypto-agents/b_shift_worker_rotation.py'
      - 'crypto-agents/b_shift_accountability.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-reporting:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile worker reports, hierarchy and Chief D code
        run: python -m py_compile crypto-agents/hierarchical_reporting.py crypto-agents/post_hierarchical_reports.py crypto-agents/chief_D_reporting.py crypto-agents/b_learning_by_doing.py crypto-agents/ai_process_worker.py crypto-agents/b_worker_buyer_source.py crypto-agents/b_shift_worker_rotation.py crypto-agents/b_shift_accountability.py
      - name: Check original-source buyer qualification without fake acceptance
        run: python crypto-agents/b_worker_buyer_source.py
      - name: Verify all 6750 rotation slots per fleet without duplication
        run: python crypto-agents/b_shift_worker_rotation.py --self-test
      - name: Verify that Chief D only counts real workers and training receipts
        run: python crypto-agents/b_shift_accountability.py --self-test
      - name: Verify applied training and no phantom earnings
        run: python crypto-agents/b_learning_by_doing.py
      - name: Regression-test all worker tiers and two company separation
        run: python crypto-agents/test_hierarchical_reporting.py
