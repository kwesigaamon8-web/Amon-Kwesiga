name: Owner Directive Full Prompt Cascade to Final H Workers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crypto-agents/directive_cascade.py'
      - 'crypto-agents/OWNER_DIRECTIVE_CASCADE_PROMPT.md'
      - 'crypto-agents/chief_D_owner_orders.json'
      - 'crypto-agents/PUBLIC_AGENT_COMMAND.json'
      - 'crypto-agents/ai_process_worker.py'
      - 'crypto-agents/director_work_orders.py'
      - 'crypto-agents/enigma_all_b_systems.py'
      - '.github/workflows/owner-prompt-cascade-to-h-leaves.yml'
permissions:
  contents: read
jobs:
  prove-leaf-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax, current owner signature and full path to H
        run: |
          python -m py_compile crypto-agents/directive_cascade.py crypto-agents/ai_process_worker.py crypto-agents/director_work_orders.py crypto-agents/enigma_all_b_systems.py
          python crypto-agents/directive_cascade.py --self-test --out owner-cascade-evidence
          python crypto-agents/owner_first_oath.py
          python crypto-agents/command_chain_receipts.py
      - name: Verify full unabridged instruction in one real director dispatch and 750 assigned worker packets
        env:
          ROLE_ID: D01
          WORKFORCE_ID: transferexperiment
        run: |
          python crypto-agents/director_work_orders.py
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          doc=json.loads(Path("director-work-orders/D01.json").read_text())
          chief=json.loads(Path("crypto-agents/chief_D_owner_orders.json").read_text())
          public=json.loads(Path("crypto-agents/PUBLIC_AGENT_COMMAND.json").read_text())
          order=chief["orders"][-1]["instruction"]
          digest=hashlib.sha256(order.encode()).hexdigest()
          assert doc["complete_latest_human_instruction"]==order
          assert doc["exact_current_owner_instruction_sha256"]==digest
          assert doc["first_tier_work_order_count"]==750
          assert len(doc["manager_assignments"])==15
          assert len(doc["individual_first_tier_worker_assignments"])==750
          assert public["owner_command"]==order
          for worker in doc["individual_first_tier_worker_assignments"]:
              assert worker["chief_D_universal_audit_and_open_research_order"]==order
              assert worker["human_owner_directive_cascade"]["full_owner_instruction_sha256"]==digest
              assert worker["command_chain_assignment"]["current_organization_route"][-1]=="transferexperiment/"+worker["agent_id"]
          print("DIRECTOR_TO_MANAGERS_TO_750_W_ROLE_PACKETS_PASS",
                "directors",1,"managers",15,"role_packets",750,"actual_ai_inferences",0)
          PY
      - name: Run six real isolated final-level H worker processes
        run: |
          python - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          root=Path("owner-cascade-evidence")
          rec=[]
          for fleet in ("transferexperiment","BountyScoutAI"):
            for role in ("D01-M01-W01-S001-G001-H001",
                         "D10-M15-W50-S150-G500-H666",
                         "D04-M08-W22-S099-G272-H333"):
              job=subprocess.run([sys.executable,"crypto-agents/directive_cascade.py",
                "--fleet",fleet,"--role",role,"--task",
                "Check source credibility and buyer eligibility; log explicit evidence or failure",
                "--out",str(root/fleet/role)],capture_output=True,text=True,timeout=30)
              assert job.returncode==0,(fleet,role,job.stderr[-1000:])
              receipt=json.loads((root/fleet/role/"one-leaf-delivery-receipt.json").read_text())
              assert receipt["exact_process_worker_id"]==fleet+"/"+role
              assert receipt["full_prompt_loaded_by_actual_python_process"] is True
              assert receipt["model_response_present"] is False
              rec.append(receipt)
          assert len(rec)==6
          print("REAL_H_LEAF_FULL_PROMPT_RECEIPTS",len(rec),
                "model_inferences",0,"external_customer_contact",0)
          PY
      - name: Keep original full-text prompt and per-leaf receipts as audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-to-last-H-worker-instruction-receipts
          path: owner-cascade-evidence/
          if-no-files-found: warn
          retention-days: 14
