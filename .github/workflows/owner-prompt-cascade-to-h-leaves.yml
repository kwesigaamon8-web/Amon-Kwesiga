name: Owner Directive Full Prompt Cascade to Final H Workers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crypto-agents/directive_cascade.py'
      - 'crypto-agents/OWNER_DIRECTIVE_CASCADE_PROMPT.md'
      - 'crypto-agents/chief_D_owner_orders.json'
      - 'crypto-agents/PUBLIC_AGENT_COMMAND.json'
      - '.github/workflows/owner-prompt-cascade-to-h-leaves.yml'
permissions:
  contents: read
jobs:
  prove-leaf-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax, current owner signature and full path to H
        run: |
          python -m py_compile crypto-agents/directive_cascade.py
          python crypto-agents/directive_cascade.py --self-test --out owner-cascade-evidence
      - name: Run six real isolated final-level H worker processes
        run: |
          python - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          root=Path("owner-cascade-evidence")
          rec=[]
          for fleet in ("transferexperiment","BountyScoutAI"):
            for role in ("D01-M01-W01-S001-G001-H001",
                         "D10-M15-W50-S150-G500-H666",
                         "D04-M08-W22-S099-G272-H333"):
              job=subprocess.run([sys.executable,"crypto-agents/directive_cascade.py",
                "--fleet",fleet,"--role",role,"--task",
                "Check source credibility and buyer eligibility; log explicit evidence or failure",
                "--out",str(root/fleet/role)],capture_output=True,text=True,timeout=30)
              assert job.returncode==0,(fleet,role,job.stderr[-1000:])
              receipt=json.loads((root/fleet/role/"one-leaf-delivery-receipt.json").read_text())
              assert receipt["exact_process_worker_id"]==fleet+"/"+role
              assert receipt["full_prompt_loaded_by_actual_python_process"] is True
              assert receipt["model_response_present"] is False
              rec.append(receipt)
          assert len(rec)==6
          print("REAL_H_LEAF_FULL_PROMPT_RECEIPTS",len(rec),
                "model_inferences",0,"external_customer_contact",0)
          PY
      - name: Keep original full-text prompt and per-leaf receipts as audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-to-last-H-worker-instruction-receipts
          path: owner-cascade-evidence/
          if-no-files-found: warn
          retention-days: 14
