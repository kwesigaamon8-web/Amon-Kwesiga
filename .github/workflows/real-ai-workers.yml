name: Real Free-Hosted AI Worker Processes

on:
  workflow_dispatch:
  schedule:
    - cron: '7 4 * * *'
  push:
    paths:
      - '.github/workflows/real-ai-workers.yml'
      - 'crypto-agents/ai_process_worker.py'
      - 'crypto-agents/role_ai_identity.py'
      - 'crypto-agents/ai_process_launcher.py'
      - 'crypto-agents/ai_process_audit.py'
      - 'crypto-agents/director_work_orders.py'
      - 'crypto-agents/owner_order_distribution.py'
concurrency:
  group: real-free-worker-processes
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  real-worker-processes:
    name: ${{ matrix.director }} actual AI worker OS processes
    runs-on: ubuntu-latest
    timeout-minutes: 28
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        director: [D01, D02, D03, D04, D05, D06, D07, D08, D09, D10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Issue all 750 first-tier worker orders for this director
        env:
          ROLE_ID: ${{ matrix.director }}
        run: python crypto-agents/director_work_orders.py
      - name: Install bounded free CPU AI model requirements
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet 'transformers>=4.44,<5'
      - name: Actually launch isolated per-worker operating-system processes
        env:
          ROLE_ID: ${{ matrix.director }}
          REAL_AI_PROCESSES_PER_DIRECTOR: '50'
          MAX_BATCH_SECONDS: '1080'
          HF_HUB_DISABLE_TELEMETRY: '1'
          OMP_NUM_THREADS: '2'
        run: python crypto-agents/ai_process_launcher.py
      - name: Upload real process proofs and 750 queued worker assignments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-ai-processes-${{ matrix.director }}
          path: |
            ai-process-reports/
            director-work-orders/
          if-no-files-found: warn
          retention-days: 7

  audit-processes:
    name: Verify true AI processes, not virtual definitions
    if: always()
    needs: real-worker-processes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve actual worker logs and per-role documents
        uses: actions/download-artifact@v4
        with:
          pattern: real-ai-processes-*
          merge-multiple: true
          path: combined-ai-processes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit executed processes versus assigned identities
        run: python crypto-agents/ai_process_audit.py
      - name: Archive verified counts and blockers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-ai-workers-overall-audit
          path: |
            ai-process-summary.json
            ai-process-summary.md
          if-no-files-found: warn
          retention-days: 7
