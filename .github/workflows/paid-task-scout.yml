name: B and D Grounded Paid Task Scout
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/paid-task-scout.yml'
      - 'crypto-agents/paid_task_scout.py'
      - 'crypto-agents/new_earning_lanes.py'
      - 'crypto-agents/b_fleet_integrity.py'
      - 'crypto-agents/d10_payment_director.py'
      - 'crypto-agents/chief_D_reporting.py'
      - 'crypto-agents/b_two_company_census.py'
      - 'crypto-agents/chief_D_owner_orders.json'
      - 'crypto-agents/everyone_peer_audit.py'
      - 'crypto-agents/test_everyone_peer_audit.py'
      - 'crypto-agents/command_chain_receipts.py'
      - 'crypto-agents/subagent_audit.py'
      - 'crypto-agents/seven_billion_allocator.py'
      - 'crypto-agents/command_ack_gate.py'
      - 'crypto-agents/system_health_gate.py'
      - 'crypto-agents/ten_ideas_exercise.py'
      - 'crypto-agents/ten_idea_board.py'
      - 'crypto-agents/b_address_understanding.py'
      - 'crypto-agents/hierarchical_idea_governance.py'
      - 'crypto-agents/cross_fleet_idea_exchange.py'
  schedule:
    - cron: '9 * * * *'
concurrency:
  group: shared-paid-task-scout
  cancel-in-progress: false
permissions:
  contents: read
  issues: write
jobs:
  scout-verifiable-paying-work:
    name: Original-source research and one owner report
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile local D10, Chief D and fleet integrity
        run: python -m py_compile crypto-agents/paid_task_scout.py crypto-agents/b_fleet_integrity.py crypto-agents/d10_payment_director.py crypto-agents/chief_D_reporting.py crypto-agents/b_two_company_census.py crypto-agents/seven_billion_allocator.py crypto-agents/command_ack_gate.py crypto-agents/ai_process_launcher.py crypto-agents/ai_process_worker.py crypto-agents/strict_worker_accountability.py crypto-agents/cross_fleet_idea_exchange.py
      - name: Regression-test complete peer crosschecks, zero phantom reviewers and empty worker pools
        run: python crypto-agents/test_everyone_peer_audit.py
      - name: Verify both Chief D to local director chains and nested worker routes
        run: python crypto-agents/command_chain_receipts.py
      - name: Check child-audit schema before expensive 30-role research runs
        run: python crypto-agents/subagent_audit.py --output structural-child-audit
      - name: Fail early if both companies' execution/reporting system drifts
        run: python crypto-agents/system_health_gate.py
      - name: Verify exactly 7B uniquely indexed eligible roles and current order acknowledgement test
        run: |
          python crypto-agents/seven_billion_allocator.py --self-test
          python crypto-agents/command_ack_gate.py
      - name: Independently evaluate ten-idea menu and distinct response grading
        run: python crypto-agents/ten_ideas_exercise.py
      - name: Distribute ten accountable earning ideas to each of both company directors
        run: python crypto-agents/ten_idea_board.py
      - name: Show 20-director 200-idea evidence-gated assignment ledger
        run: cat chief-D-reports/CHIEF_D_TEN_IDEA_BOARD.md >> "$GITHUB_STEP_SUMMARY"
      - name: Validate correct B1/B2 Bitcoin addresses, optional Base-USDC HOLD and Chief D reporting
        run: python crypto-agents/b_address_understanding.py
      - name: Verify Chief D -> two 10-director boards -> manager -> W/S/G/H corrections
        run: python crypto-agents/hierarchical_idea_governance.py
      - name: Validate independent B1/B2 boards and one overarching Chief D
        run: python crypto-agents/b_fleet_integrity.py
      - name: Two independent local D10 payments audits and read-only BTC snapshots
        run: python crypto-agents/d10_payment_director.py
      - name: Show D10 payment audit in workflow summary
        run: cat d10-payment-reports/D10_TWO_ACCOUNT_PAYMENT_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Census both companies' complete mathematical hierarchy without claiming live models
        run: python crypto-agents/b_two_company_census.py
      - name: Display both workforce totals and active-agent limitations
        run: cat chief-D-reports/TWO_COMPANY_WORKFORCE_CENSUS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Expand earnings search to recent independently listed GitHub rewards, flag unverified funding
        env:
          GH_TOKEN: ${{ github.token }}
        run: python crypto-agents/new_earning_lanes.py
      - name: Show new job-scout results and genuine miner opt-in limitations
        run: cat paid-opportunity-reports/new-earning-lanes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Test two-company real-model idea provenance, dedup and action queue
        run: python crypto-agents/cross_fleet_idea_exchange.py test
      - name: Share latest REAL B1/B2 idea digests and assign cross-company source reviews
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python crypto-agents/cross_fleet_idea_exchange.py review
      - name: Display Chief D's actual idea sharing, corrective reviews and original-source action queue
        run: cat idea-exchange/CHIEF_D_CROSS_COMPANY_ACTIONS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Chief D consolidates TWO separate ten-director company boards and owner orders
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python crypto-agents/chief_D_reporting.py
      - name: Show one Chief D owner report in workflow summary
        run: cat chief-D-reports/CHIEF_D_TO_OWNER.md >> "$GITHUB_STEP_SUMMARY"
      - name: Scan public listings and original sponsor issues
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python crypto-agents/paid_task_scout.py
      - name: Archive all checked candidate leads and blockers
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joint-paid-task-scout
          path: |
            paid-opportunity-reports/
            d10-payment-reports/
            structural-child-audit/
            system-health-reports/
            chief-D-reports/
            idea-exchange/
          if-no-files-found: warn
          retention-days: 7
