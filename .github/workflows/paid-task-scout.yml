name: B and D Grounded Paid Task Scout
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/paid-task-scout.yml'
      - 'crypto-agents/paid_task_scout.py'
      - 'crypto-agents/taskmarket_base_usdc_scout.py'
      - 'crypto-agents/basebounty_usdc_scout.py'
      - 'crypto-agents/hondo_base_usdc_scout.py'
      - 'crypto-agents/bounty_eligibility_audit.py'
      - 'crypto-agents/paid-work/revenue_conversion_gate.py'
      - 'crypto-agents/paid-work/conversion-targets.json'
      - 'crypto-agents/worldwide_paid_work_seeds.json'
      - 'crypto-agents/worldwide_paid_work_scout.py'
      - 'crypto-agents/social_scan.py'
      - 'crypto-agents/social_work_pipeline.py'
      - 'crypto-agents/b_inbound_buyer_watch.py'
      - 'crypto-agents/public_board_buyer_watch.py'
      - 'crypto-agents/new_earning_lanes.py'
      - 'crypto-agents/b_fleet_integrity.py'
      - 'crypto-agents/d10_payment_director.py'
      - 'crypto-agents/chief_D_reporting.py'
      - 'crypto-agents/b_two_company_census.py'
      - 'crypto-agents/chief_D_owner_orders.json'
      - 'crypto-agents/b_collection_assignments.json'
      - 'crypto-agents/test_cash_first_priority.py'
      - 'crypto-agents/chief_D_reporting.py'
      - 'crypto-agents/everyone_peer_audit.py'
      - 'crypto-agents/test_everyone_peer_audit.py'
      - 'crypto-agents/command_chain_receipts.py'
      - 'crypto-agents/subagent_audit.py'
      - 'crypto-agents/seven_billion_allocator.py'
      - 'crypto-agents/command_ack_gate.py'
      - 'crypto-agents/system_health_gate.py'
      - 'crypto-agents/ten_ideas_exercise.py'
      - 'crypto-agents/ten_idea_board.py'
      - 'crypto-agents/b_address_understanding.py'
      - 'crypto-agents/hierarchical_idea_governance.py'
      - 'crypto-agents/unique_funding_tasks.py'
      - 'crypto-agents/secondary_software_study.py'
      - 'crypto-agents/public_code_reader.py'
      - 'crypto-agents/cross_fleet_idea_exchange.py'
  schedule:
    - cron: '9 * * * *'
concurrency:
  group: shared-paid-task-scout
  cancel-in-progress: false
permissions:
  contents: read
  issues: write
jobs:
  scout-verifiable-paying-work:
    name: Original-source research and one owner report
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile local D10, Chief D and fleet integrity
        run: python -m py_compile crypto-agents/paid_task_scout.py crypto-agents/b_fleet_integrity.py crypto-agents/d10_payment_director.py crypto-agents/chief_D_reporting.py crypto-agents/b_two_company_census.py crypto-agents/seven_billion_allocator.py crypto-agents/command_ack_gate.py crypto-agents/ai_process_launcher.py crypto-agents/ai_process_worker.py crypto-agents/strict_worker_accountability.py crypto-agents/cross_fleet_idea_exchange.py crypto-agents/unique_funding_tasks.py crypto-agents/secondary_software_study.py crypto-agents/public_code_reader.py
      - name: Reject hidden-startup-instruction demands in third-party bounties
        run: |
          python crypto-agents/bounty_source_safety.py
          python crypto-agents/bounty_eligibility_audit.py --self-test
      - name: Regression-test complete peer crosschecks, zero phantom reviewers and empty worker pools
        run: python crypto-agents/test_everyone_peer_audit.py
      - name: Verify both Chief D to local director chains and nested worker routes
        run: python crypto-agents/command_chain_receipts.py
      - name: Check child-audit schema before expensive 30-role research runs
        run: python crypto-agents/subagent_audit.py --output structural-child-audit
      - name: Fail early if both companies' execution/reporting system drifts
        run: python crypto-agents/system_health_gate.py
      - name: Verify exactly 7B uniquely indexed eligible roles and current order acknowledgement test
        run: |
          python crypto-agents/seven_billion_allocator.py --self-test
          python crypto-agents/command_ack_gate.py
      - name: Independently evaluate ten-idea menu and distinct response grading
        run: python crypto-agents/ten_ideas_exercise.py
      - name: Distribute ten accountable earning ideas to each of both company directors
        run: python crypto-agents/ten_idea_board.py
      - name: Show 20-director 200-idea evidence-gated assignment ledger
        run: cat chief-D-reports/CHIEF_D_TEN_IDEA_BOARD.md >> "$GITHUB_STEP_SUMMARY"
      - name: Validate correct B1/B2 Bitcoin addresses, optional Base-USDC HOLD and Chief D reporting
        run: python crypto-agents/b_address_understanding.py
      - name: Validate 1000 diverse individual funding tasks and worldwide legal software learning
        run: |
          python crypto-agents/unique_funding_tasks.py
          python crypto-agents/secondary_software_study.py
          python crypto-agents/public_code_reader.py
      - name: Verify Chief D -> two 10-director boards -> manager -> W/S/G/H corrections
        run: python crypto-agents/hierarchical_idea_governance.py
      - name: Validate independent B1/B2 boards and one overarching Chief D
        run: python crypto-agents/b_fleet_integrity.py
      - name: Test incoming-money-first and strict receiving-only wallet instruction
        run: python crypto-agents/test_cash_first_priority.py
      - name: Two independent local D10 payments audits and read-only BTC snapshots
        run: python crypto-agents/d10_payment_director.py
      - name: Show D10 payment audit in workflow summary
        run: cat d10-payment-reports/D10_TWO_ACCOUNT_PAYMENT_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Census both companies' complete mathematical hierarchy without claiming live models
        run: python crypto-agents/b_two_company_census.py
      - name: Display both workforce totals and active-agent limitations
        run: cat chief-D-reports/TWO_COMPANY_WORKFORCE_CENSUS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Expand earnings search to recent independently listed GitHub rewards, flag unverified funding
        env:
          GH_TOKEN: ${{ github.token }}
        run: python crypto-agents/new_earning_lanes.py
      - name: Show new job-scout results and genuine miner opt-in limitations
        run: cat paid-opportunity-reports/new-earning-lanes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Filter unpayable, region-restricted, unauthenticated offers before converting work
        run: |
          python crypto-agents/paid-work/revenue_conversion_gate.py
          python - <<'PY'
          import json,os
          rows=json.load(open("paid-opportunity-reports/conversion-scorecard.json"))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("\n### Payment acceptance gates — no paper income\n")
              for row in rows:
                  f.write("- "+row["id"]+": "+row["status"]+
                          (" — "+", ".join(row["reasons"]) if row["reasons"] else "")+"\n")
              f.write("Confirmed new crypto receipts from this filter: NOT ESTABLISHED.\n")
          PY
      - name: Test two-company real-model idea provenance, dedup and action queue
        run: python crypto-agents/cross_fleet_idea_exchange.py test
      - name: Share latest REAL B1/B2 idea digests and assign cross-company source reviews
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python crypto-agents/cross_fleet_idea_exchange.py review
      - name: Display Chief D's actual idea sharing, corrective reviews and original-source action queue
        run: cat idea-exchange/CHIEF_D_CROSS_COMPANY_ACTIONS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Chief D consolidates TWO separate ten-director company boards and owner orders
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python crypto-agents/chief_D_reporting.py
      - name: Show one Chief D owner report in workflow summary
        run: cat chief-D-reports/CHIEF_D_TO_OWNER.md >> "$GITHUB_STEP_SUMMARY"
      - name: Verify inbound buyer-watch filter with synthetic public comments
        run: python crypto-agents/b_inbound_buyer_watch.py --self-test
      - name: Check all existing owner public sales channels for real external inquiries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python crypto-agents/b_inbound_buyer_watch.py
          python - <<'PY'
          import json, os
          with open('paid-opportunity-reports/inbound-buyer-requests.json') as f:
              d=json.load(f)
          with open(os.environ["GITHUB_STEP_SUMMARY"],'a') as f:
              f.write('\n### Chief D inbound customer check\n')
              f.write('- Public sales channels checked: '+str(d['owner_public_sales_issues_checked'])+'\n')
              f.write('- Externally authored possible inquiries: '+str(d['external_inquiry_count'])+' (NOT independently qualified buyers)\n')
              f.write('- Check status: '+d['status']+'; missing issue checks: '+str(len(d['failed_issue_checks']))+'\n')
              f.write('- Confirmed contracts or payments from this check: **0**\n')
          PY
      - name: Regression check source-backed global B1/B2 income scout without sending crypto
        run: python crypto-agents/worldwide_paid_work_scout.py --self-test
      - name: Rotate through global paying buyers and agent-work boards
        run: |
          python crypto-agents/worldwide_paid_work_scout.py
          cat paid-opportunity-reports/worldwide.md >> "$GITHUB_STEP_SUMMARY"
      - name: Verify social lead screening without posting
        run: python crypto-agents/social_work_pipeline.py --self-test
      - name: Search public Bluesky and Reddit hiring posts for B1/B2 worldwide work
        run: |
          python crypto-agents/social_work_pipeline.py
          cat paid-opportunity-reports/social-work.md >> "$GITHUB_STEP_SUMMARY"
      - name: Scan public listings and original sponsor issues
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python crypto-agents/paid_task_scout.py
      - name: Run safe Taskmarket Base-USDC read-only scout
        run: |
          python crypto-agents/taskmarket_base_usdc_scout.py --self-test
          python crypto-agents/taskmarket_base_usdc_scout.py
          python - <<'PY'
          import json, os
          d=json.load(open('paid-opportunity-reports/taskmarket-base-usdc.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n### Taskmarket Base USDC bounty source (unverified potential, NOT income)\n')
              f.write('- Public task rows: '+str(d['source_rows_checked'])+'; screened candidates: '+str(d['candidate_count'])+'\n')
              f.write('- Errors: '+str(d['source_errors'])+'\n')
              for c in d['candidate_unverified'][:5]:
                  f.write('- '+c['id']+': '+c['advertised_usdc_base']+' USDC — '+c['status']+' — '+c['source_url']+'\n')
              f.write('- Signed applications, accepted deliveries, and confirmed owner deposits: NONE from this scout.\n')
          PY
      - name: Run read-only BaseBounty USDC source scout
        run: |
          python crypto-agents/basebounty_usdc_scout.py --self-test
          python crypto-agents/basebounty_usdc_scout.py
          python - <<'PY'
          import json, os
          d=json.load(open('paid-opportunity-reports/basebounty-base-usdc.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('\n### BaseBounty Base USDC paying jobs (source-only; NOT collected revenue)\n')
              f.write('- Jobs checked: '+str(d['source_rows'])+'; candidates: '+str(d['candidate_count'])+'\n')
              f.write('- Source errors: '+str(d['source_errors'])+'\n')
              for x in d['candidates_unverified'][:5]:
                  f.write('- Job '+x['job_id']+': '+x['worker_payout_usdc_advertised']+
                          ' USDC — '+x['status']+' — '+x['api_url']+'\n')
              f.write('- Wallet signatures, accepted contracts, verified receipts: NONE from this scan.\n')
          PY
      - name: Check Hondō Base-USDC genuine claimable no-cost agent tasks (read-only)
        run: |
          python crypto-agents/hondo_base_usdc_scout.py --self-test
          python crypto-agents/hondo_base_usdc_scout.py
          python - <<'PY'
          import json, os
          d=json.load(open('paid-opportunity-reports/hondo-base-usdc.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n### Hondō Base USDC source screening — read only\n')
              f.write('- Source: '+d['source']+'\n')
              f.write('- Status: '+d['source_status']+'; records inspected: '+str(d['rows_seen'])+'\n')
              f.write('- Candidate tasks (NOT accepted or paid): '+str(d['potential_claimable_count'])+'\n')
              f.write('- Errors: '+str(d['source_errors'])+'\n')
              for x in d['screened'][:8]:
                  f.write('- '+x['task_id']+': '+x['status']+'; '+str(x['advertised_usdc'])+
                          ' USDC; '+x['detail_url']+'; blockers: '+','.join(x['blockers'])+'\n')
              f.write('- No claims, purchases, keys, wallet signatures, submissions, acceptance or owner deposits from the scout.\n')
          PY
      - name: Check verified published public Board thread for possible buyer replies
        run: |
          python crypto-agents/public_board_buyer_watch.py --self-test
          python crypto-agents/public_board_buyer_watch.py
          python - <<'PY'
          import json,os
          d=json.load(open('paid-opportunity-reports/public-board-buyer-watch.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('\n### New public sales post — possible buyer responses\n')
              f.write('- Public post: '+d['public_thread']+'\n')
              f.write('- Read status: '+d['status']+'\n')
              f.write('- Visible replies (not confirmed buyers): '+str(d.get('visible_reply_count'))+'\n')
              f.write('- Customer contracts, accepted bounty or wallet deposits from this check: NONE VERIFIED.\n')
          PY
      - name: Archive all checked candidate leads and blockers
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joint-paid-task-scout
          path: |
            paid-opportunity-reports/
            d10-payment-reports/
            structural-child-audit/
            system-health-reports/
            chief-D-reports/
            idea-exchange/
          if-no-files-found: warn
          retention-days: 7
