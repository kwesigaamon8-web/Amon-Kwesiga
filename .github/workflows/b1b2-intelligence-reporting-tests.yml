name: B1 B2 Worker Intelligence Reporting Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'crypto-agents/b_worker_intelligence_router.py'
      - 'crypto-agents/test_b_worker_intelligence_router.py'
      - 'crypto-agents/hierarchical_reporting.py'
      - 'crypto-agents/post_hierarchical_reports.py'
      - '.github/workflows/b1b2-intelligence-reporting-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Python source compiles
        run: python -m py_compile crypto-agents/b_worker_intelligence_router.py crypto-agents/test_b_worker_intelligence_router.py crypto-agents/post_hierarchical_reports.py
      - name: Verify B1 and B2 inbox routing tests
        run: python crypto-agents/test_b_worker_intelligence_router.py
      - name: Confirm zero-report scenario never invents workers
        run: |
          python crypto-agents/b_worker_intelligence_router.py --fleet transferexperiment --reports /tmp/no-real-worker-reports --out /tmp/b1b2-ci-inbox
          python crypto-agents/b_worker_intelligence_router.py --fleet BountyScoutAI --reports /tmp/no-real-worker-reports --out /tmp/b1b2-ci-inbox
      - name: Expose tested zero-report inbox samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1b2-intelligence-zero-evidence-smoke
          path: /tmp/b1b2-ci-inbox/
          if-no-files-found: warn
          retention-days: 2
