name: B Owner Results Digest
on:
  workflow_run:
    workflows:
      - "Real Free-Hosted AI Worker Processes"
      - "Independent Crypto Opportunity Agents"
    types: [completed]
  schedule:
    - cron: '19 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/b-owner-results-digest.yml'
      - 'crypto-agents/director_D_completion_digest.py'
concurrency:
  group: b-owner-results-digest
  cancel-in-progress: false
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  owner-report:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify trustworthy reporting logic
        run: python crypto-agents/director_D_completion_digest.py --self-test
      - name: Post nonduplicated owner-facing report when status changes
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python crypto-agents/director_D_completion_digest.py
