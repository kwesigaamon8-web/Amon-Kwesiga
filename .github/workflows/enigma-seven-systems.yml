name: Enigma Seven Systems — 56 Real AI Role Checks
on:
  workflow_dispatch:
  schedule:
    - cron: '47 5 * * *'
  push:
    paths:
      - 'crypto-agents/enigma_seven_systems.py'
      - 'crypto-agents/test_enigma_seven_systems.py'
      - '.github/workflows/enigma-seven-systems.yml'
permissions:
  contents: read
concurrency:
  group: enigma-seven-systems
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and zero-email regression tests
        run: |
          python -m py_compile crypto-agents/enigma_seven_systems.py crypto-agents/test_enigma_seven_systems.py
          python crypto-agents/test_enigma_seven_systems.py
  attempt-model:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Activate Enigma 7 systems and 56 bounded AI roles'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pod: [G01,G02,G03,G04,G05,G06,G07]
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      ENIGMA_MODEL_ID: HuggingFaceTB/SmolLM2-135M-Instruct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded CPU model dependencies
        shell: bash
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu || echo 'CPU_TORCH_UNAVAILABLE'
          python -m pip install --quiet 'transformers>=4.44,<5' || echo 'TRANSFORMERS_UNAVAILABLE'
      - name: Attempt eight real inference calls for this system
        run: python crypto-agents/enigma_seven_systems.py --system ${{ matrix.pod }} --model --output enigma-seven-agent-artifacts/${{ matrix.pod }}
      - name: Publish factual, privacy-safe agent status artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enigma-seven-${{ matrix.pod }}-model-evidence
          path: enigma-seven-agent-artifacts/${{ matrix.pod }}/*.json
          if-no-files-found: warn
          retention-days: 7
