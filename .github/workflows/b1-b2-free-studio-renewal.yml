name: B1 B2 Free Studio Hosting Renewal
on:
  push:
    paths:
      - '.github/workflows/b1-b2-free-studio-renewal.yml'
      - 'docs/index.html'
      - 'docs/software.html'
      - 'docs/join.html'
      - 'docs/payment.html'
      - 'docs/assets/**'
      - 'docs/tests/**'
      - 'docs/crypto-ledger/**'
      - 'docs/bitcoin-merchant/**'
      - 'docs/agent-services.json'
      - 'docs/llms.txt'
      - 'docs/.well-known/**'
  schedule:
    # Twice weekly, not mining/inference. A new anonymous preview lasts 7 days.
    - cron: '17 5 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b1-b2-free-studio-host-renewal
  cancel-in-progress: false

jobs:
  renew:
    name: Test site, deploy public no-login preview, update stable site directory
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Original source automated tests
        run: |
          set -euo pipefail
          node --test docs/tests/*.test.js
          test -s docs/index.html
          test -s docs/software.html
          test -s docs/join.html
          test -s docs/payment.html
          test -s docs/assets/engine.js
          test -s docs/assets/app.js
          test -s docs/assets/reconcile.js
          test -s docs/assets/reconcile-ui.js
          test -s docs/assets/styles.css
          node --test crypto-agents/commercial-work/crypto-ledger-reconciler/*.test.mjs
          node --test crypto-agents/commercial-work/africa-bitcoin-merchant-wallet/*.test.mjs
          for item in docs/join.html docs/payment.html docs/software.html docs/crypto-ledger/index.html docs/crypto-ledger/styles.css docs/crypto-ledger/core.mjs docs/crypto-ledger/app.js docs/bitcoin-merchant/index.html docs/bitcoin-merchant/wallet_core.mjs docs/bitcoin-merchant/invoice_ledger.mjs docs/bitcoin-merchant/fictional_demo.mjs docs/agent-services.json docs/llms.txt docs/.well-known/agent.json; do
            test -s "$item"
          done
          grep -q 'href="software.html"' docs/index.html
          grep -q 'href="join.html"' docs/index.html
          grep -q 'href="payment.html"' docs/index.html
          grep -q 'bc1qvprle87txnk7dgcgsau0nauxvvkwuyp0w9zc0z' docs/payment.html
          grep -q 'bc1qtaunz7mx7k588p8v544tq7x7ezxxcfky0h2vn9' docs/payment.html
          grep -q 'href="crypto-ledger/index.html"' docs/index.html
          grep -q 'href="bitcoin-merchant/index.html"' docs/index.html
          grep -q 'href="agent-services.json"' docs/index.html
      - name: Deploy public-only static files using anonymous free API, not Render
        id: publish
        run: |
          set -euo pipefail
          umask 077
          cd docs
          zip -q ../studio-preview.zip index.html software.html join.html payment.html assets/styles.css assets/engine.js assets/app.js assets/reconcile.js assets/reconcile-ui.js crypto-ledger/index.html crypto-ledger/styles.css crypto-ledger/core.mjs crypto-ledger/app.js bitcoin-merchant/index.html bitcoin-merchant/wallet_core.mjs bitcoin-merchant/invoice_ledger.mjs bitcoin-merchant/fictional_demo.mjs agent-services.json llms.txt .well-known/agent.json
          cd ..
          curl -fSs --retry 2 --retry-delay 5 --max-time 50 \
            -X POST 'https://ship.page/deploy' \
            -H 'Content-Type: application/zip' \
            --data-binary @studio-preview.zip -o publish-private.json
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json,os,urllib.parse
          payload=json.loads(Path('publish-private.json').read_text())
          url=payload.get('url','')
          parsed=urllib.parse.urlsplit(url)
          assert parsed.scheme=='https' and (parsed.hostname or '').endswith('.ship.place'), 'invalid live page URL'
          assert {'index.html','software.html','join.html','payment.html','assets/styles.css','assets/engine.js','assets/app.js','assets/reconcile.js','assets/reconcile-ui.js','crypto-ledger/index.html','crypto-ledger/styles.css','crypto-ledger/core.mjs','crypto-ledger/app.js','bitcoin-merchant/index.html','bitcoin-merchant/wallet_core.mjs','bitcoin-merchant/invoice_ledger.mjs','bitcoin-merchant/fictional_demo.mjs','agent-services.json','llms.txt','.well-known/agent.json'}<=set(payload.get('files') or []), 'missing published asset'
          exp=payload.get('expires_at')
          assert exp and 'T' in exp, 'anonymous expiry not provided'
          now=datetime.now(timezone.utc).strftime('%d %B %Y %H:%M UTC')
          body=f'''# B1/B2 Digital Work Studio — live public service

          **Open the latest working digital service site:** {url}

          **Browse all shared software:** [10-tool catalogue]({url}software.html).

          **Native BTC-mainnet receiving details for pre-agreed client work:** [B1/B2 payment page]({url}payment.html). Public address display is not proof of an invoice or verified wallet control.\n\n          **Find real opt-in project collaborators:** [Join B1/B2]({url}join.html) — invites only, not verified workers or mining income.\n\nThis public, no-login website contains original in-browser CSV/JSON conversion, data-quality checks, two-file reconciliation, a working BTC/Base-USDC export-to-ledger reconciler, a Bitcoin mainnet read-only merchant invoice evidence wallet, and a machine-readable fixed-scope paid-service catalogue. These run from public static files only, without wallet signatures or private uploads. Customer inquiries can use the GitHub issue form (account required) or the public Agent Board linked below. Never post private records in either route.

          **New deployment confirmed:** {now}

          **Temporary host expires:** {exp}. A scheduled no-fee deployment job refreshes the website twice weekly using only publicly committed static files. The current URL changes on renewal; always return to this stable GitHub document for the latest verified address.

          [Request a real paid-service quote on GitHub](https://github.com/kwesigaamon8-web/Amon-Kwesiga/issues/new?template=paid-work-request.yml)

          [Ask about a non-sensitive task on the public Agent Board](https://www.task-bounty.com/board/43a7a645-082f-4f5f-87b8-f5397ec9c121) (no GitHub account required; third-party availability is not guaranteed). Both inquiry routes are public discussions, not payment checkouts. Never post confidential records or credentials.

          [Browse original site source and tested browser tools](https://github.com/kwesigaamon8-web/Amon-Kwesiga/tree/main/docs)

          No real buyer, paid contract or incoming cryptocurrency is implied by website hosting. No wallet transaction or email is made by the deployment.
          '''
          Path('docs/LIVE_SITE.md').write_text(body,encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f'## B1/B2 free static site deployed\n\n- **Site:** {url}\n- **Expiry:** {exp}\n- **Permanent link directory:** https://github.com/kwesigaamon8-web/Amon-Kwesiga/blob/main/docs/LIVE_SITE.md\n- **All 20 public assets uploaded**; no account, no email, no wallet use.\n- Not a sale or a payment.\n')
          print('PUBLIC_DEPLOYMENT_CONFIRMED',json.dumps({'url':url,'expiry':exp,'files':len(payload.get('files',[]))}))
          PY
          rm -f publish-private.json studio-preview.zip
      - name: Independently check all live site assets before publishing link
        run: |
          set -euo pipefail
          url="$(grep -Eo 'https://[a-z0-9-]+\.ship\.place/' docs/LIVE_SITE.md | head -1)"
          [ -n "$url" ]
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          curl -fSsL --max-time 25 "$url" -o "$scratch/home.html"
          curl -fSsL --max-time 25 "$url"assets/engine.js -o "$scratch/engine.js"
          curl -fSsL --max-time 25 "$url"assets/app.js -o "$scratch/app.js"
          curl -fSsL --max-time 25 "$url"assets/reconcile.js -o "$scratch/reconcile.js"
          curl -fSsL --max-time 25 "$url"assets/reconcile-ui.js -o "$scratch/reconcile-ui.js"
          curl -fSsL --max-time 25 "$url"assets/styles.css -o "$scratch/styles.css"
          grep -q 'Digital Work Studio' "$scratch/home.html"
          grep -q 'assets/reconcile.js' "$scratch/home.html"
          grep -q 'function' "$scratch/engine.js"
          grep -q 'function' "$scratch/reconcile.js"
          grep -q 'function' "$scratch/reconcile-ui.js"
          [ -s "$scratch/styles.css" ]
          for asset in software.html join.html payment.html crypto-ledger/index.html crypto-ledger/styles.css crypto-ledger/core.mjs crypto-ledger/app.js bitcoin-merchant/index.html bitcoin-merchant/wallet_core.mjs bitcoin-merchant/invoice_ledger.mjs bitcoin-merchant/fictional_demo.mjs agent-services.json llms.txt .well-known/agent.json; do
            mkdir -p "$scratch/$(dirname "$asset")"
            curl -fSsL --max-time 25 "${url}${asset}" -o "$scratch/$asset"
            test -s "$scratch/$asset"
          done
          grep -q 'Crypto Ledger' "$scratch/crypto-ledger/index.html" || grep -q 'reconcil' "$scratch/crypto-ledger/index.html"
          grep -q 'Bitcoin Merchant Watch Wallet' "$scratch/bitcoin-merchant/index.html"
          grep -q 'b1b2-digital-services/v1' "$scratch/agent-services.json"
          grep -q 'wallet_core.mjs' "$scratch/bitcoin-merchant/index.html"
          grep -q 'Bitcoin Merchant Watch Wallet' "$scratch/software.html"
          grep -q 'Bitcoin mining' "$scratch/software.html"
          grep -q 'Bitcoin mainnet' "$scratch/payment.html"
          grep -q 'bc1qvprle87txnk7dgcgsau0nauxvvkwuyp0w9zc0z' "$scratch/payment.html"
          grep -q 'bc1qtaunz7mx7k588p8v544tq7x7ezxxcfky0h2vn9' "$scratch/payment.html"
          grep -q 'collaborator-join.yml' "$scratch/join.html"
          grep -q 'join.html' "$scratch/home.html"
          echo "FULL_PUBLIC_20_ASSET_CHECK_PASS $url"
          echo "INDEPENDENT_HTTPS_CHECK_PASS $url"
      - name: Publish stable latest-site directory in owner repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Other revenue workers may push commits while this HTTPS check runs.
          # Rebase the ONE generated file onto the latest remote main, not the
          # entire stale checkout, and retry if a concurrent unrelated push wins.
          cp docs/LIVE_SITE.md /tmp/verified-live-site.md
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/verified-live-site.md docs/LIVE_SITE.md
            git add docs/LIVE_SITE.md
            if git diff --cached --quiet; then
              echo "PUBLIC_LIVE_SITE_DIRECTORY_ALREADY_CURRENT"
              exit 0
            fi
            git commit -m "Refresh verified public B1/B2 studio URL without Render"
            if git push origin HEAD:main; then
              echo "PUBLIC_LIVE_SITE_DIRECTORY_UPDATED"
              exit 0
            fi
            echo "Concurrent push detected; retry verified-site-only commit"
            sleep "$((attempt * 2))"
          done
          echo "PUBLIC_LIVE_SITE_DIRECTORY_UPDATE_FAILED_AFTER_RETRIES" >&2
          exit 1
