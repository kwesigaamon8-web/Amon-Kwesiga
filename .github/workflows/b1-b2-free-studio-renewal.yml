name: B1 B2 Free Studio Hosting Renewal
on:
  push:
    paths:
      - '.github/workflows/b1-b2-free-studio-renewal.yml'
      - 'docs/index.html'
      - 'docs/brand-ai.html'
      - 'docs/agent-work-market.html'
      - 'docs/share-ai-services.html'
      - 'docs/share-free-software.html'
      - 'docs/pc-ai-miner.html'
      - 'docs/free-toolbox.html'
      - 'docs/mini-apps.html'
      - 'docs/market-lab.html'
      - 'docs/free-software-manifest.json'
      - 'docs/FREE_SOFTWARE_LICENSE.md'
      - 'docs/software.html'
      - 'docs/join.html'
      - 'docs/payment.html'
      - 'docs/ai.html'
      - 'docs/personal-ai-custom-apps.html'
      - 'docs/personal-daily-checkin-demo.html'
      - 'docs/assets/**'
      - 'docs/tests/**'
      - 'docs/crypto-ledger/**'
      - 'docs/bitcoin-merchant/**'
      - 'docs/agent-services.json'
      - 'docs/llms.txt'
      - 'docs/.well-known/**'
  schedule:
    # Twice weekly, not mining/inference. A new anonymous preview lasts 7 days.
    - cron: '17 5 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b1-b2-free-studio-host-renewal
  cancel-in-progress: false

jobs:
  renew:
    name: Test site, deploy public no-login preview, update stable site directory
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Original source automated tests
        run: |
          set -euo pipefail
          node --test docs/tests/*.test.js
          test -s docs/index.html
          test -s docs/software.html
          test -s docs/join.html
          test -s docs/payment.html
          test -s SUPPORT.md
          test -s .github/FUNDING.yml
          grep -q 'id="support"' docs/payment.html
          grep -q 'SUPPORT.md' .github/FUNDING.yml
          grep -q 'SUPPORT.md' docs/index.html
          test -s docs/ai.html
          test -s docs/personal-ai-custom-apps.html
          test -s docs/personal-daily-checkin-demo.html
          grep -q 'not an AI model' docs/personal-daily-checkin-demo.html
          grep -q 'personal-daily-checkin-demo.html' docs/personal-ai-custom-apps.html
          test -s docs/free-toolbox.html
          test -s docs/mini-apps.html
          test -s docs/market-lab.html
          test -s docs/assets/market-lab.js
          test -s docs/brand-ai.html
          test -s docs/agent-work-market.html
          test -s docs/share-ai-services.html
          test -s docs/share-free-software.html
          test -s docs/pc-ai-miner.html
          grep -q 'Run 32 example hashes' docs/pc-ai-miner.html
          test -s docs/free-software-manifest.json
          test -s docs/FREE_SOFTWARE_LICENSE.md
          test -s docs/assets/free-toolbox.js
          test -s docs/assets/free-toolbox-extensions.js
          test -s docs/assets/free-mini-apps.js
          test -s docs/assets/engine.js
          test -s docs/assets/app.js
          test -s docs/assets/reconcile.js
          test -s docs/assets/reconcile-ui.js
          test -s docs/assets/styles.css
          node --test crypto-agents/commercial-work/crypto-ledger-reconciler/*.test.mjs
          node --test crypto-agents/commercial-work/africa-bitcoin-merchant-wallet/*.test.mjs
          for item in docs/join.html docs/payment.html docs/ai.html docs/software.html docs/crypto-ledger/index.html docs/crypto-ledger/styles.css docs/crypto-ledger/core.mjs docs/crypto-ledger/app.js docs/bitcoin-merchant/index.html docs/bitcoin-merchant/wallet_core.mjs docs/bitcoin-merchant/invoice_ledger.mjs docs/bitcoin-merchant/fictional_demo.mjs docs/agent-services.json docs/llms.txt docs/.well-known/agent.json; do
            test -s "$item"
          done
          grep -q 'href="software.html"' docs/index.html
          grep -q 'href="join.html"' docs/index.html
          grep -q 'href="payment.html"' docs/index.html
          grep -q 'href="ai.html"' docs/index.html
          grep -q 'href="share-ai-services.html"' docs/index.html
          grep -q 'paid-work-request.yml' docs/ai.html
          grep -q 'bc1qvprle87txnk7dgcgsau0nauxvvkwuyp0w9zc0z' docs/payment.html
          grep -q 'bc1qtaunz7mx7k588p8v544tq7x7ezxxcfky0h2vn9' docs/payment.html
          grep -q 'href="crypto-ledger/index.html"' docs/index.html
          grep -q 'href="bitcoin-merchant/index.html"' docs/index.html
          grep -q 'href="agent-services.json"' docs/index.html
      - name: Deploy public-only static files using anonymous free API, not Render
        id: publish
        run: |
          set -euo pipefail
          umask 077
          cd docs
          zip -q ../studio-preview.zip index.html software.html join.html payment.html ai.html personal-ai-custom-apps.html personal-daily-checkin-demo.html brand-ai.html agent-work-market.html share-ai-services.html free-toolbox.html mini-apps.html market-lab.html share-free-software.html pc-ai-miner.html free-software-manifest.json FREE_SOFTWARE_LICENSE.md assets/free-toolbox.js assets/free-toolbox-extensions.js assets/free-mini-apps.js assets/market-lab.js assets/styles.css assets/engine.js assets/app.js assets/reconcile.js assets/reconcile-ui.js crypto-ledger/index.html crypto-ledger/styles.css crypto-ledger/core.mjs crypto-ledger/app.js bitcoin-merchant/index.html bitcoin-merchant/wallet_core.mjs bitcoin-merchant/invoice_ledger.mjs bitcoin-merchant/fictional_demo.mjs agent-services.json llms.txt .well-known/agent.json
          cd ..
          curl -fSs --retry 2 --retry-delay 5 --max-time 50 \
            -X POST 'https://ship.page/deploy' \
            -H 'Content-Type: application/zip' \
            --data-binary @studio-preview.zip -o publish-private.json
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json,os,urllib.parse,re
          payload=json.loads(Path('publish-private.json').read_text())
          url=payload.get('url','')
          parsed=urllib.parse.urlsplit(url)
          assert parsed.scheme=='https' and (parsed.hostname or '').endswith('.ship.place'), 'invalid live page URL'
          assert {'index.html','software.html','join.html','payment.html','ai.html','personal-ai-custom-apps.html','personal-daily-checkin-demo.html','brand-ai.html','agent-work-market.html','share-ai-services.html','free-toolbox.html','mini-apps.html','market-lab.html','share-free-software.html','pc-ai-miner.html','free-software-manifest.json','FREE_SOFTWARE_LICENSE.md','assets/free-toolbox.js','assets/free-toolbox-extensions.js','assets/free-mini-apps.js','assets/market-lab.js','assets/styles.css','assets/engine.js','assets/app.js','assets/reconcile.js','assets/reconcile-ui.js','crypto-ledger/index.html','crypto-ledger/styles.css','crypto-ledger/core.mjs','crypto-ledger/app.js','bitcoin-merchant/index.html','bitcoin-merchant/wallet_core.mjs','bitcoin-merchant/invoice_ledger.mjs','bitcoin-merchant/fictional_demo.mjs','agent-services.json','llms.txt','.well-known/agent.json'}<=set(payload.get('files') or []), 'missing published asset'
          exp=payload.get('expires_at')
          assert exp and 'T' in exp, 'anonymous expiry not provided'
          now=datetime.now(timezone.utc).strftime('%d %B %Y %H:%M UTC')
          body=f'''# B1/B2 Digital Work Studio — live public service

          **Latest static preview verified by this deployment's test run:** {url}. This temporary copy may lag any later repository changes; use the permanent GitHub links below for accurate buyer/payment terms.

          **Permanent buyer and support routes:** [ENIGMA-only scoped customer enquiry](https://github.com/kwesigaamon8-web/Amon-Kwesiga/issues/35) · [Optional BTC-mainnet support with B1/B2 receiving addresses](https://github.com/kwesigaamon8-web/Amon-Kwesiga/blob/main/SUPPORT.md) · [Current AI service catalogue source](https://github.com/kwesigaamon8-web/Amon-Kwesiga/blob/main/docs/agent-work-market.html). Support is voluntary, no payment is required for free tools, and an advertised offer or wallet address is not proof of a paid job or receipt.

          **Browse all shared software:** [Original source catalogue]({url}software.html) · **[PC AI Miner — educational SHA256d demos and consented mining]({url}pc-ai-miner.html)**.

          **Use the owner-authorized free suite:** [55 original browser utilities]({url}free-toolbox.html) · [6 practical mini apps]({url}mini-apps.html) · [6 new free business and marketing applications]({url}market-lab.html) · [Share the software worldwide]({url}share-free-software.html) · [MIT source license]({url}FREE_SOFTWARE_LICENSE.md).

          **Hire B1/B2 for concrete AI-assisted research, data cleanup and QA:** [AI services and buyer request]({url}ai.html) — scoped, human-reviewed offers, not actual booked sales.\n\n          **ENIGMA independent personal AI & apps:** [Request an individualized AI or app]({url}personal-ai-custom-apps.html) · [Try our working private daily check-in demo]({url}personal-daily-checkin-demo.html) · $25 starter custom planner quote after agreement. The planner is rules-based, not a medical service or standalone AI.\n\n          **Browse our new buyer marketplace:** [AI-agent and human buyer offers]({url}agent-work-market.html) · [Seven-platform, six-language voluntary sharing centre]({url}share-ai-services.html). Sharing links only open social composers; they do not publish without user interaction.\n\n          **Native BTC-mainnet receiving details for pre-agreed client work:** [B1/B2 payment page]({url}payment.html). Public address display is not proof of an invoice or verified wallet control.\n\n          **Find real opt-in project collaborators:** [Join B1/B2]({url}join.html) — invites only, not verified workers or mining income.\n\nThis public, no-login website contains original in-browser CSV/JSON conversion, data-quality checks, two-file reconciliation, a working BTC/Base-USDC export-to-ledger reconciler, a Bitcoin mainnet read-only merchant invoice evidence wallet, and a machine-readable fixed-scope paid-service catalogue. These run from public static files only, without wallet signatures or private uploads. Customer inquiries can use the GitHub issue form (account required) or the public Agent Board linked below. Never post private records in either route.

          This free release adds 55 local browser utilities and 12 original mini-apps, with public tests and voluntary project support only. Nothing in the public toolbox requires wallet access, donations or private data uploads.

          **New deployment confirmed:** {now}

          **Temporary host expires:** {exp}. A scheduled no-fee deployment job refreshes the website twice weekly using only publicly committed static files. The current URL changes on renewal; always return to this stable GitHub document for the latest verified address.

          [Request a real paid-service quote on GitHub](https://github.com/kwesigaamon8-web/Amon-Kwesiga/issues/new?template=paid-work-request.yml)

          [Ask about a non-sensitive task on the public Agent Board](https://www.task-bounty.com/board/43a7a645-082f-4f5f-87b8-f5397ec9c121) (no GitHub account required; third-party availability is not guaranteed). Both inquiry routes are public discussions, not payment checkouts. Never post confidential records or credentials.

          [Browse original site source and tested browser tools](https://github.com/kwesigaamon8-web/Amon-Kwesiga/tree/main/docs)

          No real buyer, paid contract or incoming cryptocurrency is implied by website hosting. No wallet transaction or email is made by the deployment.
          '''
          # Template lines inherit YAML's ten-space indentation; strip it
          # before writing Markdown so buyer hyperlinks are clickable, not code.
          body=re.sub(r'(?m)^ {10}(?=\S)', '', body)
          Path('docs/TEMP_PREVIEW.md').write_text(body,encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f'## B1/B2 free static site deployed\n\n- **Site:** {url}\n- **Expiry:** {exp}\n- **Temporary backup preview URL directory:** https://github.com/kwesigaamon8-web/Amon-Kwesiga/blob/main/docs/TEMP_PREVIEW.md\n- **PC AI Miner and the public studio assets uploaded**; no account, no email, no wallet use.\n- Not a sale or a payment.\n')
          print('PUBLIC_DEPLOYMENT_CONFIRMED',json.dumps({'url':url,'expiry':exp,'files':len(payload.get('files',[]))}))
          PY
          rm -f publish-private.json studio-preview.zip
      - name: Independently check all live site assets before publishing link
        run: |
          set -euo pipefail
          url="$(grep -Eo 'https://[a-z0-9-]+\.ship\.place/' docs/TEMP_PREVIEW.md | head -1)"
          [ -n "$url" ]
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          curl -fSsL --max-time 25 "$url" -o "$scratch/home.html"
          curl -fSsL --max-time 25 "$url"assets/engine.js -o "$scratch/engine.js"
          curl -fSsL --max-time 25 "$url"assets/app.js -o "$scratch/app.js"
          curl -fSsL --max-time 25 "$url"assets/reconcile.js -o "$scratch/reconcile.js"
          curl -fSsL --max-time 25 "$url"assets/reconcile-ui.js -o "$scratch/reconcile-ui.js"
          curl -fSsL --max-time 25 "$url"assets/styles.css -o "$scratch/styles.css"
          grep -q 'Digital Work Studio' "$scratch/home.html"
          grep -q 'assets/reconcile.js' "$scratch/home.html"
          grep -q 'function' "$scratch/engine.js"
          grep -q 'function' "$scratch/reconcile.js"
          grep -q 'function' "$scratch/reconcile-ui.js"
          [ -s "$scratch/styles.css" ]
          for asset in software.html join.html payment.html ai.html personal-ai-custom-apps.html personal-daily-checkin-demo.html brand-ai.html agent-work-market.html share-ai-services.html free-toolbox.html mini-apps.html market-lab.html share-free-software.html pc-ai-miner.html free-software-manifest.json FREE_SOFTWARE_LICENSE.md assets/free-toolbox.js assets/free-toolbox-extensions.js assets/free-mini-apps.js assets/market-lab.js crypto-ledger/index.html crypto-ledger/styles.css crypto-ledger/core.mjs crypto-ledger/app.js bitcoin-merchant/index.html bitcoin-merchant/wallet_core.mjs bitcoin-merchant/invoice_ledger.mjs bitcoin-merchant/fictional_demo.mjs agent-services.json llms.txt .well-known/agent.json; do
            mkdir -p "$scratch/$(dirname "$asset")"
            curl -fSsL --max-time 25 "${url}${asset}" -o "$scratch/$asset"
            test -s "$scratch/$asset"
          done
          grep -q 'Crypto Ledger' "$scratch/crypto-ledger/index.html" || grep -q 'reconcil' "$scratch/crypto-ledger/index.html"
          grep -q 'Bitcoin Merchant Watch Wallet' "$scratch/bitcoin-merchant/index.html"
          grep -q 'b1b2-digital-services/v1' "$scratch/agent-services.json"
          grep -q 'wallet_core.mjs' "$scratch/bitcoin-merchant/index.html"
          grep -q 'Bitcoin Merchant Watch Wallet' "$scratch/software.html"
          grep -q '55 free software tools' "$scratch/free-toolbox.html"
          grep -q 'assets/free-toolbox-extensions.js' "$scratch/free-toolbox.html"
          grep -q 'Six more free mini applications' "$scratch/mini-apps.html"
          grep -q 'Six new free business' "$scratch/market-lab.html"
          grep -q '67' "$scratch/free-software-manifest.json"
          grep -q 'Share useful free software worldwide' "$scratch/share-free-software.html"
          grep -q 'Run 32 example hashes' "$scratch/pc-ai-miner.html"
          grep -q 'assets/free-mini-apps.js' "$scratch/mini-apps.html"
          grep -q 'Bitcoin mining' "$scratch/software.html"
          grep -q 'Bitcoin mainnet' "$scratch/payment.html"
          grep -q 'Hire our AI-assisted' "$scratch/ai.html"
          grep -q 'Small data and Bitcoin software jobs' "$scratch/agent-work-market.html"
          grep -q 'Share B1/B2' "$scratch/share-ai-services.html"
          grep -q 'bc1qvprle87txnk7dgcgsau0nauxvvkwuyp0w9zc0z' "$scratch/payment.html"
          grep -q 'bc1qtaunz7mx7k588p8v544tq7x7ezxxcfky0h2vn9' "$scratch/payment.html"
          grep -q 'collaborator-join.yml' "$scratch/join.html"
          grep -q 'join.html' "$scratch/home.html"
          grep -q 'personal-daily-checkin-demo.html' "$scratch/home.html"
          grep -q 'My Daily Check-in' "$scratch/personal-daily-checkin-demo.html"
          grep -q 'not an AI model' "$scratch/personal-daily-checkin-demo.html"
          grep -q 'Request a scoped proposal' "$scratch/personal-ai-custom-apps.html"
          echo "FULL_PUBLIC_32_ASSET_CHECK_PASS $url"
          echo "INDEPENDENT_HTTPS_CHECK_PASS $url"
      - name: Publish stable latest-site directory in owner repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Other revenue workers may push commits while this HTTPS check runs.
          # Rebase the ONE generated file onto the latest remote main, not the
          # entire stale checkout, and retry if a concurrent unrelated push wins.
          cp docs/TEMP_PREVIEW.md /tmp/verified-live-site.md
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/verified-live-site.md docs/TEMP_PREVIEW.md
            git add docs/TEMP_PREVIEW.md
            if git diff --cached --quiet; then
              echo "PUBLIC_BACKUP_PREVIEW_ALREADY_CURRENT"
              exit 0
            fi
            git commit -m "Refresh temporary public B1/B2 studio backup URL"
            if git push origin HEAD:main; then
              echo "PUBLIC_BACKUP_PREVIEW_UPDATED"
              exit 0
            fi
            echo "Concurrent push detected; retry verified-site-only commit"
            sleep "$((attempt * 2))"
          done
          echo "PUBLIC_BACKUP_PREVIEW_UPDATE_FAILED_AFTER_RETRIES" >&2
          exit 1
