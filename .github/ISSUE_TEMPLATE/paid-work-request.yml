name: "Request an ENIGMA digital service quote"
description: "ENIGMA-only digital services. No owner accounting, tax, audit, consulting, or private-client work."
title: "[Paid work request] "
body:
  - type: markdown
    attributes:
      value: |
        **ENIGMA ONLY:** This independent project does not accept the owner's accounting, tax, audit or professional consulting engagements. GitHub sign-in is required to submit this public issue. **Before posting:** This is a public GitHub issue. Describe the work using fictional or anonymized examples only. **Never** share bank statements, account numbers, personal client or patient data, medical histories, credentials, wallet secrets, or confidential documents.
        **Quick request:** tell us what result you need and choose a service. For OSINT we use only lawfully accessible public information with dated citations, never personal surveillance or private data harvesting. Full scoped portfolio: https://github.com/kwesigaamon8-web/Amon-Kwesiga/blob/main/docs/ENIGMA_GLOBAL_PAID_SERVICES_2026-11-22.md. The budget, deadline, tests and BTC/payment network can be agreed afterwards. No deposit or payment is requested to obtain a quote; this form is not a contract.
  - type: dropdown
    id: service
    attributes:
      label: Requested service
      options:
        - Tiny CSV cleanup pilot (up to 100 rows and 20 columns; proposed USD 5 starter)
        - Public Bitcoin-mainnet transaction evidence check (one TXID; proposed USD 15 starter)
        - Private daily check-in planner customization (up to five fields; proposed USD 25 starter)
        - Receive-only BTC merchant checkout adaptation (proposed USD 30 starter)
        - BTC / Base-native-USDC exported-ledger reconciliation (up to 500 rows; proposed USD 50 starter)
        - CSV / Excel / JSON conversion
        - Payment or invoice reconciliation
        - Workbook cleanup
        - Public-data research and analysis
        - OSINT: public company / organization research and source-cited report
        - OSINT: public competitor, pricing or market research
        - OSINT: public tenders, grants, funded bounties and supplier landscape
        - OSINT: public website / software / product due diligence
        - Website, landing page or digital storefront customization
        - Original software prototype, automation or data quality app
        - Technical documentation, original tutorials and reproducible research
        - Technical testing / software documentation
        - Product catalog / marketing copy review
        - Personal AI assistant (private/local or cloud)
        - Custom website, web app, or mobile app
        - Routine, wellness, or appointment reminder app (non-diagnostic)
        - Non-financial workflow automation
        - Exceptional tailor-made original code (new algorithm, bespoke tool or integration; quote after scope review)
        - Other original digital service
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What result do you need?
      description: Provide a clear outcome and a synthetic/anonymized example. Avoid private records.
      placeholder: "Example: turn a 100-row synthetic CSV into one JSON object per customer, with columns A, B and C..."
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: How should we test that the work is complete?
      description: Optional at enquiry stage. If unsure, we will propose tests for you to approve before work.
      placeholder: "Example: 100 rows processed; duplicate IDs flagged; totals match; no missing output keys."
    validations:
      required: false
  - type: input
    id: budget
    attributes:
      label: Approximate budget (optional — request a quote if unsure)
      placeholder: "e.g., USD 25, BTC equivalent, or request a quote"
    validations:
      required: false
  - type: input
    id: deadline
    attributes:
      label: Desired delivery date (UTC or local timezone)
      placeholder: "e.g., 2026-11-21 UTC"
    validations:
      required: false
  - type: dropdown
    id: payment
    attributes:
      label: Preferred settlement method (optional — confirmed after scope agreement)
      options:
        - Agreed native BTC on Bitcoin mainnet
        - Native USDC on Base (subject to exact token/network and owner-route verification)
        - Another owner-confirmed crypto asset/network
        - Other agreed lawful payment method
        - Not decided
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Public issue privacy check
      options:
        - label: "I have not included passwords, private keys, personal client records, bank details, or confidential files in this public request."
          required: true
