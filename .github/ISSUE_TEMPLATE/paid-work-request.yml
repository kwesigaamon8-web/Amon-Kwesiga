name: "Request personalized AI, an app or a small digital task"
description: "Two-minute request for a personal AI, custom app, wellness reminder prototype or original digital task. Only your desired result and public-data privacy confirmation are essential."
title: "[Paid work request] "
body:
  - type: markdown
    attributes:
      value: |
        **Before posting:** This is a public GitHub issue. Describe the work using fictional or anonymized examples only. **Never** share bank statements, account numbers, personal client or patient data, medical histories, credentials, wallet secrets, or confidential documents.
        **Quick request:** tell us what result you need and choose a service. The budget, deadline, tests and BTC/payment network can be agreed afterwards. No deposit or payment is requested to obtain a quote; this form is not a contract.
  - type: dropdown
    id: service
    attributes:
      label: Requested service
      options:
        - CSV / Excel / JSON conversion
        - Payment or invoice reconciliation
        - Workbook cleanup
        - Public-data research and analysis
        - Technical testing / software documentation
        - Product catalog / marketing copy review
        - Personal AI assistant (private/local or cloud)
        - Custom website, web app, or mobile app
        - Routine, wellness, or appointment reminder app (non-diagnostic)
        - Business automation or accounting support
        - Other original digital service
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What result do you need?
      description: Provide a clear outcome and a synthetic/anonymized example. Avoid private records.
      placeholder: "Example: turn a 100-row synthetic CSV into one JSON object per customer, with columns A, B and C..."
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: How should we test that the work is complete?
      description: Optional at enquiry stage. If unsure, we will propose tests for you to approve before work.
      placeholder: "Example: 100 rows processed; duplicate IDs flagged; totals match; no missing output keys."
    validations:
      required: false
  - type: input
    id: budget
    attributes:
      label: Approximate budget (optional — request a quote if unsure)
      placeholder: "e.g., USD 25, BTC equivalent, or request a quote"
    validations:
      required: false
  - type: input
    id: deadline
    attributes:
      label: Desired delivery date (UTC or local timezone)
      placeholder: "e.g., 2026-11-21 UTC"
    validations:
      required: false
  - type: dropdown
    id: payment
    attributes:
      label: Preferred settlement method (optional — confirmed after scope agreement)
      options:
        - Agreed native BTC on Bitcoin mainnet
        - Another owner-confirmed crypto asset/network
        - Other agreed lawful payment method
        - Not decided
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Public issue privacy check
      options:
        - label: "I have not included passwords, private keys, personal client records, bank details, or confidential files in this public request."
          required: true
